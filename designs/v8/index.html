<title>OkamiOps Landing v8</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="modes.css">
<style>
/* Layout: hero arrastável; capítulos empilhados (sticky) alternando lobo/papel e máquina/noite. Sem ilustração: tipografia, lobo oficial e prints reais dos produtos. */
.ch{position:sticky;top:68px;min-height:calc(100vh - 68px);min-height:calc(100svh - 68px);display:flex;flex-direction:column;justify-content:center;padding-block:clamp(104px,9vw,140px) clamp(120px,10vw,160px);clip-path:polygon(0 clamp(36px,5vw,72px),100% 0,100% 100%,0 100%);margin-top:calc(-1 * clamp(36px,5vw,72px))}
.ch:nth-of-type(even){clip-path:polygon(0 0,100% clamp(36px,5vw,72px),100% 100%,0 100%)}
.hold{height:55vh;pointer-events:none}
@media (max-width:900px){.hold{display:none}}
.ch>.dim{position:absolute;inset:0;background:#000;opacity:var(--dim,0);pointer-events:none;z-index:3}
.ch>.wrap{position:relative;z-index:1;width:100%;transform:scale(var(--sc,1));transform-origin:50% 0}
.ch .top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:end;margin-bottom:clamp(32px,4vw,52px)}
.ch .top h2{font-size:calc(clamp(44px,5.6vw,92px) * var(--ds));line-height:.94;margin-top:16px}
.rail{position:fixed;z-index:65;left:max(14px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:grid;gap:8px;transition:opacity .3s}
.rail a{position:relative;width:14px;height:14px;border-radius:3px;border:1px solid #6a6a80;transition:transform .25s}
.rail a.l{background:var(--paper)} .rail a.m{background:var(--night)}
.rail a.on{transform:scale(1.5);border-color:var(--o)}
.rail a span{position:absolute;left:24px;top:50%;transform:translate(-4px,-50%);white-space:nowrap;font:500 11px var(--mono);color:var(--fg);background:var(--night);padding:3px 8px;border-radius:6px;opacity:0;transition:.2s;pointer-events:none;border:1px solid var(--line)}
.rail a:hover span,.rail a:focus-visible span{opacity:1;transform:translate(0,-50%)}

/* molduras */
.browser{border-radius:14px;overflow:hidden;background:#fff;box-shadow:0 0 0 1px rgba(20,20,26,.14),0 40px 80px -30px rgba(20,20,26,.45)}
.maq .browser{box-shadow:0 0 0 1px #2a2a3d,0 40px 80px -30px rgba(0,0,0,.8)}
.browser .bar{display:flex;align-items:center;gap:8px;height:38px;padding:0 14px;background:#ecebe6;border-bottom:1px solid #dad8d0}
.browser .bar i{width:11px;height:11px;border-radius:50%;background:#d0cec6}
.browser .bar i:nth-child(1){background:#ff5f57}.browser .bar i:nth-child(2){background:#febc2e}.browser .bar i:nth-child(3){background:#28c840}
.browser .url{flex:1;max-width:360px;margin-inline:auto;height:24px;border-radius:7px;background:#fff;display:flex;align-items:center;justify-content:center;gap:6px;font:500 12px var(--mono);color:#55566a;padding:0 10px;overflow:hidden;white-space:nowrap}
.browser .url::before{content:"🔒";font-size:10px}
.browser .shot{position:relative;aspect-ratio:16/10;background:#f4f2ee;overflow:hidden}
.browser .shot img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;transition:opacity .45s,transform .6s}
.phone{width:100%;max-width:260px;aspect-ratio:390/844;border-radius:40px;padding:10px;background:#16161f;box-shadow:0 0 0 1px #2c2c3d,0 40px 80px -30px rgba(0,0,0,.7)}
.phone img{width:100%;height:100%;object-fit:cover;object-position:top;border-radius:31px;display:block}

/* 01 produtos: vitrine */
.vit{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:clamp(32px,4vw,64px);align-items:center}
.plist{display:grid;border-top:1px solid var(--ink)}
.plist button{display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:4px 16px;padding:16px 0;border:0;border-bottom:1px solid var(--paper-line);background:none;text-align:left;cursor:pointer;color:inherit}
.plist .nm{font:400 clamp(34px,3.6vw,58px)/1 var(--serif);color:var(--ink);letter-spacing:-.03em;transition:color .25s}
.plist .tg{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-soft)}
.plist .d{grid-column:1/-1;font-size:15px;max-height:0;overflow:hidden;opacity:0;transition:max-height .4s,opacity .3s,margin .3s}
.plist button[aria-selected=true] .nm{font-style:italic;color:var(--k-ink)}
.plist button[aria-selected=true] .tg{color:var(--k-ink)}
.plist button[aria-selected=true] .d{max-height:120px;opacity:1;margin-top:6px}
.vit .go{margin-top:20px}
.stage{position:relative}
.stage .badge{position:absolute;left:-14px;bottom:28px;z-index:2;display:inline-flex;align-items:center;gap:8px;padding:10px 14px;border-radius:999px;background:var(--night);color:var(--fg);font:500 12px var(--mono);box-shadow:0 14px 30px -12px rgba(0,0,0,.6)}

/* 02 serviços */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sv{display:flex;flex-direction:column;gap:12px;min-height:230px;padding:26px;border-radius:16px;border:1px solid var(--line);background:var(--night-1);transition:transform .3s,border-color .3s}
.sv:hover{transform:translateY(-6px);border-color:var(--k)}
.sv .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--k)}
.sv h3{font:500 22px/1.15 var(--mono);color:var(--fg);letter-spacing:-.03em}
.sv p{font-size:15px;flex:1}
.sv .io{font:400 12.5px var(--mono);color:var(--fg);padding-top:12px;border-top:1px dashed var(--line)}
.web{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;margin-top:28px;padding-top:28px;border-top:1px solid var(--line)}
.web h3{font:500 clamp(24px,2.4vw,34px)/1.1 var(--mono);color:var(--fg);letter-spacing:-.04em;margin:12px 0}
.web h3 em{font-style:normal;color:var(--c)}
.web .kicker{color:var(--c)}

/* 03 comunidade: prints */
.ogrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px}
.oc{display:flex;flex-direction:column;gap:10px;min-width:0}
.oc .browser .bar{height:26px;padding:0 10px;gap:6px}
.oc .browser .bar i{width:8px;height:8px}
.oc .browser .url{height:16px;font-size:10px;max-width:200px}
.oc .browser .url::before{font-size:8px}
.oc .browser .shot{aspect-ratio:16/10}
.oc:hover .browser .shot img{transform:scale(1.04)}
.oc .row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-top:4px}
.oc h3{font:400 28px/1 var(--serif);color:var(--ink);letter-spacing:-.02em}
.oc .pl{font:500 10.5px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--k-ink);white-space:nowrap}
.oc p{font-size:13.5px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.oc.noimg .shot{display:grid;place-items:center;background:var(--night);color:var(--fg);font:500 13px var(--mono)}
.tally{grid-column:span 2;grid-row:span 2;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr);gap:24px;align-items:center;padding:24px;border-radius:18px;background:var(--night);color:var(--fg-soft)}
.tally .phone{max-width:230px;justify-self:center}
.tally .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c)}
.tally h3{font:400 clamp(44px,4vw,64px)/.92 var(--serif);color:var(--fg);letter-spacing:-.035em;margin:10px 0 12px}
.tally p{font-size:15px;margin-bottom:18px}
.tally .store{background:var(--paper);color:var(--ink)}
.sent{grid-column:3/5;grid-row:span 2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:24px;align-items:center;padding:24px;border-radius:18px;background:var(--night);color:var(--fg-soft)}
.sent .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--o)}
.sent h3{font:400 clamp(44px,4vw,64px)/.92 var(--serif);color:var(--fg);letter-spacing:-.035em;margin:10px 0 12px}
.sent p{font-size:15px;margin-bottom:18px}
.sent .browser{box-shadow:0 0 0 1px #2a2a3d,0 40px 80px -30px rgba(0,0,0,.8)}
.sent .browser .shot{aspect-ratio:4/3}
.sent:hover .browser .shot img{transform:scale(1.03)}
.oc.txt{justify-content:space-between;padding:22px;border-radius:14px;background:var(--night);color:var(--fg-soft)}
.oc.txt h3{color:var(--fg)}
.oc.txt p{-webkit-line-clamp:4;color:var(--fg-soft)}
.oc.txt .go{font:500 12px var(--mono);color:var(--fg)}
.ghw{grid-column:1/3;display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding:24px 26px;border-radius:14px;border:1.5px solid var(--ink)}
.ghw b{font:400 clamp(26px,2.4vw,36px)/1.05 var(--serif);color:var(--ink);letter-spacing:-.02em}
.ghw span{font:500 12px var(--mono);color:var(--ink-soft)}


/* heros A/B/C */
body[data-hero=a] .hero-v:not(.ha),body[data-hero=b] .hero-v:not(.hb),body[data-hero=c] .hero-v:not(.hc){display:none}
.hs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.hs div{display:grid;gap:4px;font:400 12px var(--mono);color:var(--fg-mute)}
.hs b{font:500 clamp(30px,3vw,46px)/1 var(--mono);color:var(--fg);letter-spacing:-.05em}
.hsw{position:fixed;z-index:90;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);display:flex;align-items:center;gap:4px;padding:4px 4px 4px 14px;border-radius:999px;background:var(--night);border:1px solid #3a3a50;box-shadow:0 14px 30px -10px rgba(0,0,0,.6);font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-mute)}
.hsw button{width:36px;height:32px;border:0;border-radius:999px;background:none;color:var(--fg);font:600 13px var(--mono);cursor:pointer}
.hsw button[aria-checked=true]{background:var(--o);color:var(--night)}

/* A · comparador refinado */
.ha .cmp{display:grid}
.ha-l{grid-area:1/1;padding-block:clamp(48px,5vw,84px) clamp(48px,5vw,80px)}
.ha-g{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 48px}
.ha-g .kicker{grid-column:1/-1}
.ha-1,.ha-2{grid-column:1/-1}
.ha-1{justify-self:start;margin-top:22px}
.ha-2{justify-self:end;text-align:right;margin-top:6px}
.lp .ha-1,.lp .ha-2{font:400 clamp(60px,8.6vw,148px)/.9 var(--serif);color:var(--ink);letter-spacing:-.045em}
.lp .ha-1 em{font-style:italic;color:var(--o-ink)} .lp .ha-2 em{font-style:italic;color:var(--c-ink)}
.lm .ha-1,.lm .ha-2{font:500 clamp(38px,5.4vw,94px)/1.08 var(--mono);color:var(--fg);letter-spacing:-.06em}
.lm .ha-1 em{font-style:normal;color:var(--o)} .lm .ha-2 em{font-style:normal;color:var(--c)}
.ha-b{grid-column:1/2;display:grid;gap:22px;margin-top:clamp(28px,3vw,44px);max-width:520px}
.lp .ha-b p{font-size:18px;color:var(--ink-soft)}
.lm .ha-b p{font:400 14px/1.8 var(--mono);color:var(--fg-soft)} .lm .ha-b p::before{content:"// ";color:var(--c)}
.ha .knob{top:auto;bottom:clamp(44px,5vw,80px);transform:translate(-50%,0)}
.ha .hint{top:auto;bottom:calc(100% + 12px)}
.ha-s{background:var(--night);border-top:1px solid var(--line);padding-block:26px calc(30px + clamp(36px,5vw,72px))}

/* B · diagonal */
.hb{position:relative;background:var(--night);overflow:hidden}
.hb-top{background:var(--paper);padding-block:clamp(48px,6vw,88px) clamp(130px,15vw,220px)}
.hb-top .kicker{color:var(--o-ink)}
.hb-top h1{font:400 clamp(72px,14vw,240px)/.82 var(--serif);color:var(--ink);letter-spacing:-.055em;margin-top:22px}
.hb-top h1 em{font-style:italic;color:var(--o-ink)}
.hb-bot{position:relative;background:var(--night);margin-top:calc(-1 * clamp(110px,13vw,200px));clip-path:polygon(0 clamp(70px,9vw,140px),100% 0,100% 100%,0 100%);padding-block:clamp(150px,14vw,210px) calc(clamp(36px,4vw,56px) + clamp(36px,5vw,72px))}
.hb-bot>.wrap:first-child{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:end;margin-bottom:clamp(36px,4vw,56px)}
.hb-bot h1{grid-column:2;grid-row:1;font:500 clamp(40px,6.4vw,112px)/.98 var(--mono);color:var(--fg);letter-spacing:-.06em;text-align:right}
.hb-bot h1 em{font-style:normal;color:var(--c)}
.hb-side{grid-column:1;grid-row:1;display:grid;gap:22px}
.hb-side p{font-size:18px;color:var(--fg-soft)}
.hb-bot .hs{padding-top:24px;border-top:1px solid var(--line)}
.hb-emb{position:absolute;z-index:3;left:0;top:0;width:clamp(110px,10vw,170px);transform:translate(-50%,-50%)}

/* C · lobo central */
.hc-g{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;background:linear-gradient(90deg,var(--paper) 50%,var(--night) 50%);min-height:calc(100vh - 68px);min-height:calc(100svh - 68px)}
.hc-l,.hc-r{display:flex;flex-direction:column;gap:22px;padding-block:clamp(56px,6vw,96px)}
.hc-l{align-items:flex-end;text-align:right;padding-left:max(24px,calc((100vw - var(--max))/2 + 24px),env(safe-area-inset-left,0px));color:var(--ink-soft)}
.hc-r{align-items:flex-start;padding-right:max(24px,calc((100vw - var(--max))/2 + 24px),env(safe-area-inset-right,0px));color:var(--fg-soft)}
.hc-l .kicker{color:var(--o-ink)} .hc-r .kicker{color:var(--c)}
.hc-l h1{font:400 clamp(56px,6.6vw,118px)/.88 var(--serif);color:var(--ink);letter-spacing:-.045em}
.hc-l h1 em{font-style:italic;color:var(--o-ink)}
.hc-r h1{font:500 clamp(34px,3.9vw,68px)/1.04 var(--mono);color:var(--fg);letter-spacing:-.06em}
.hc-r h1 em{font-style:normal;color:var(--c)}
.hc-l p{font-size:17px;max-width:400px}
.hc-r p{font:400 13.5px/1.8 var(--mono);max-width:400px} .hc-r p::before{content:"// ";color:var(--c)}
.hc-l .acts{justify-content:flex-end}
.hc-r .hs{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 28px;margin-top:6px;padding-top:20px;border-top:1px solid var(--line);width:100%;max-width:420px}
.hc-c{padding-inline:clamp(28px,3.6vw,64px)}
.hc-c .emblem{width:clamp(240px,25vw,420px);box-shadow:0 0 0 14px rgba(6,6,10,.04),0 50px 100px -40px rgba(0,0,0,.7)}

@media (max-width:900px){
  .ha-g{grid-template-columns:1fr}
  .ha-2{justify-self:start;text-align:left}
  .ha-b{grid-column:1}
  .ha .knob{bottom:20px;width:84px}
  .hs{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hb-bot>.wrap:first-child{grid-template-columns:1fr}
  .hb-bot h1{grid-column:1;text-align:left}
  .hb-side{grid-row:2}
  .hb-emb{width:96px}
  .hc-g{grid-template-columns:1fr;background:none;min-height:0}
  .hc-l{background:var(--paper);align-items:flex-start;text-align:left;padding-inline:20px;padding-bottom:120px}
  .hc-l .acts{justify-content:flex-start}
  .hc-c{display:grid;justify-items:center;margin-block:-110px;padding:0;position:relative;z-index:2}
  .hc-c .emblem{width:200px}
  .hc-r{background:var(--night);padding-inline:20px;padding-top:120px}
}

/* 04 insights: vitrine com gráfico real */
.ivit{display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:clamp(28px,3.4vw,52px);align-items:start}
.ilist{display:grid;gap:10px}
.ilist button{display:grid;gap:6px;padding:20px 22px;border-radius:14px;border:1px solid var(--line);background:none;text-align:left;cursor:pointer;color:inherit;transition:background .25s,border-color .25s}
.ilist button:hover{background:var(--night-1)}
.ilist button[aria-selected=true]{background:var(--night-1);border-color:var(--k);box-shadow:inset 3px 0 0 var(--k)}
.ilist .lb{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute)}
.ilist .big{font:500 clamp(34px,3.4vw,52px)/.95 var(--mono);color:var(--k);letter-spacing:-.06em}
.ilist .big small{font-size:.4em;color:var(--fg-mute);letter-spacing:0}
.ilist .t{font:500 16px/1.35 var(--sans);color:var(--fg)}
.ipanel{border:1px solid var(--line);border-radius:18px;background:var(--night-1);padding:clamp(22px,2.6vw,34px);display:grid;gap:22px}
.ipanel .hd2{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.ipanel .hd2 b{font:500 14px var(--mono);color:var(--fg)}
.ipanel .hd2 span{font:400 12px var(--mono);color:var(--fg-mute)}
.callout{font:400 clamp(24px,2.4vw,34px)/1.12 var(--serif);color:var(--fg);letter-spacing:-.01em}
.callout em{font-style:italic;color:var(--k)}
.bars{display:grid;gap:7px;font:400 12.5px var(--mono)}
.br{display:grid;grid-template-columns:minmax(120px,170px) minmax(0,1fr) 84px;gap:12px;align-items:center}
.br .n{color:var(--fg-soft);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.br .t{height:14px;border-radius:4px;background:var(--night-3);overflow:hidden}
.br .t i{display:block;height:100%;width:var(--w);min-width:3px;border-radius:4px;background:var(--k);transform-origin:left;animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.br .v{text-align:right;color:var(--fg);font-variant-numeric:tabular-nums}
.br.ext .n,.br.ext .v{color:var(--fg);font-weight:600}
@keyframes grow{from{transform:scaleX(0)}}
.risks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px;font:400 12.5px var(--mono)}
.rk{display:grid;grid-template-columns:52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rk b{font-weight:600;color:var(--fg)} .rk span{color:var(--fg-soft);min-width:0}
.rk i{font-style:normal;font-size:10.5px;padding:2px 8px;border-radius:999px;border:1px solid var(--fg-mute);color:var(--fg-mute)}
.rk.hi i{background:var(--k);border-color:var(--k);color:var(--night);font-weight:600}
.tk{list-style:none;margin:0;padding:18px 0 0;border-top:1px dashed var(--line);display:grid;gap:10px;counter-reset:t}
.tk li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;font-size:15px;color:var(--fg-soft);counter-increment:t}
.tk li::before{content:counter(t,decimal-leading-zero);font:500 12px/1.9 var(--mono);color:var(--k)}
.tk b{color:var(--fg);font-weight:600}
.ipanel .ft{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;font:400 11.5px var(--mono);color:var(--fg-mute)}

/* 04 insights */
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3vw,44px)}
.ig{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:2px solid var(--fg)}
.ig .big{font:500 clamp(52px,6vw,104px)/.9 var(--mono);color:var(--k);letter-spacing:-.06em}
.ig .big small{font-size:.32em;color:var(--fg-mute);letter-spacing:0}
.ig .lb{font:500 11.5px var(--mono);color:var(--fg-mute);text-transform:uppercase;letter-spacing:.08em}
.ig h3{font:500 19px/1.3 var(--sans);color:var(--fg)}
.ig .go{font:500 12.5px var(--mono);color:var(--fg)}
.ig:hover h3{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--k)}

/* 05 empresa */
.egrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.egrid h2{font:400 clamp(52px,6.8vw,116px)/.9 var(--serif);color:var(--ink);letter-spacing:-.045em;margin:16px 0 22px}
.egrid h2 em{font-style:italic;color:var(--o-ink)}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px;counter-reset:r}
.rules div{padding:18px 0;border-top:1px solid var(--ink);display:grid;gap:6px;counter-increment:r}
.rules b{font:500 17px/1.25 var(--sans);color:var(--ink)}
.rules b::before{content:counter(r,decimal-leading-zero);display:block;font:500 12px var(--mono);color:var(--o-ink);margin-bottom:6px}
.rules span{font-size:14.5px}
.est{display:flex;gap:36px;flex-wrap:wrap;margin-top:28px}
.est div{display:grid;font:400 12px var(--mono);color:var(--ink-soft)}
.est b{font:400 52px/1 var(--serif);color:var(--ink)}

/* 06 contato */
.ctg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.ctg2 h2{font:500 clamp(44px,5.6vw,92px)/1 var(--mono);color:var(--fg);letter-spacing:-.06em;margin:16px 0 22px}
.ctg2 h2 em{font-style:normal;color:var(--o)}
.ctg2 .copyrow{color:var(--fg);margin-top:10px} .ctg2 .copyrow small{color:var(--fg-mute)}
.ctg2 form{display:grid;gap:14px;padding:28px;border-radius:18px;background:var(--night-1);border:1px solid var(--line)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ctg2 form .btn{justify-self:start;border-radius:8px}

@media (max-width:1100px){
  .sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ogrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .tally,.sent{grid-row:auto}
  .sent{grid-column:1/-1}
  .ghw{grid-column:1/-1}
}
@media (max-width:900px){
  .ch{position:relative;top:auto!important;min-height:0}
  .ch>.wrap{transform:none}
  .rail{display:none}
  .ch .top,.vit,.web,.egrid,.ctg2,.ivit{grid-template-columns:1fr}
  .igrid{grid-template-columns:1fr}
  .stage .badge{left:12px}
}
@media (max-width:640px){
  .sgrid,.ogrid,.rules,.f2,.risks{grid-template-columns:1fr}
  .br{grid-template-columns:96px minmax(0,1fr) 70px;gap:8px}
  .tally,.sent{grid-column:auto;grid-template-columns:1fr}
  .browser .url{font-size:11px}
  .ctg2 form{padding:22px}
}
.back{display:none}
</style>

<script>
const $=s=>document.querySelector(s),E=OK.esc,P=OK.pick;
$('#hdr').outerHTML=OKP.header();
$('#hero').outerHTML=HEROES.html;
document.body.insertAdjacentHTML('beforeend',HEROES.switcher);
$('#ft').outerHTML=OKP.footer();
const CH=[...document.querySelectorAll('.ch')];
CH.slice(0,-1).forEach(c=>c.insertAdjacentHTML('afterend','<div class="hold" aria-hidden="true"></div>'));
const NAMES={produtos:'nav_prod',servicos:'nav_serv',comunidade:'nav_comu',insights:'nav_ins',empresa:'nav_emp',contato:'ct_k'};
const mobile=()=>matchMedia('(max-width:640px)').matches;
let sel=0,isel=0;
function ishow(){
  const n=OK.INSIGHTS[isel],d=INSD[isel];
  document.querySelectorAll('#ilist button').forEach((b,i)=>b.setAttribute('aria-selected',i===isel));
  let chart='';
  if(d.chart==='bars'){const mx=Math.max(...d.rows.map(r=>r[1])),mn=Math.min(...d.rows.map(r=>r[1]));chart=`<div class="bars">${d.rows.map(r=>`<div class="br ${r[1]===mx||r[1]===mn?'ext':''}"><span class="n">${E(r[0])}</span><span class="t"><i style="--w:${(r[1]/mx*100).toFixed(1)}%"></i></span><span class="v">${d.fmt(r[1])}</span></div>`).join('')}</div>`}
  else{chart=`<div class="risks">${d.rows.map(r=>`<div class="rk ${r[2]?'hi':''}"><b>${r[0]}</b><span>${E(r[1])}</span><i>${E(P(r[2]?d.hi:d.mid))}</i></div>`).join('')}</div>`}
  $('#ipanel').className='ipanel k-'+n.c;
  $('#ipanel').innerHTML=`<div class="hd2"><b>${E(P(d.title))}</b><span>${d.unit?E(d.unit):''}</span></div><p class="callout">${E(P(d.callout))}</p>${chart}<ol class="tk">${d.tk.map(t=>`<li><span>${P(t)}</span></li>`).join('')}</ol><div class="ft"><span>${OK.t(d.chart==='risks'?'src3':'src')}</span><a class="btn btn-o" href="${OK.link(n.path)}" target="_blank" rel="noopener">${OK.t('read')} · ${n.min} min →</a></div>`;
}
function show(){
  const p=OK.PRODUCTS[sel];
  document.querySelectorAll('#plist button').forEach((b,i)=>b.setAttribute('aria-selected',i===sel));
  $('#purl').textContent=p.dom;
  $('#pshot').innerHTML=OK.PRODUCTS.map((q,i)=>`<img src="img/${q.img}-d.jpg" alt="${E(q.name)}, página inicial" style="opacity:${i===sel?1:0}" ${i?'loading="lazy"':''}>`).join('');
  $('#pgo').textContent=`${OK.t('visit')} ${p.dom} ↗`;$('#pgo').href=p.url;
  $('#pbadge').innerHTML=`<span class="dot"></span> ${OK.t('online')} · ${E(P(p.model))}`;
}
function render(){
  OKP.heroText();
  $('#plist').innerHTML=OK.PRODUCTS.map((p,i)=>`<button type="button" role="tab" class="k-${p.c}" aria-selected="${i===sel}"><span class="nm">${E(p.name)}</span><span class="tg">${E(P(p.kind))}</span><span class="d">${E(P(p.d))}</span></button>`).join('');
  document.querySelectorAll('#plist button').forEach((b,i)=>{const go=()=>{if(sel!==i){sel=i;show()}};b.addEventListener('mouseenter',go);b.addEventListener('focus',go);b.addEventListener('click',go)});
  show();
  $('#sgrid').innerHTML=OK.SERVICES.map(s=>`<a class="sv k-${s.c}" href="${OK.link(s.path)}" target="_blank" rel="noopener"><span class="tg">${s.tag}</span><h3>${E(P(s.name))}</h3><p>${E(P(s.d))}</p><span class="io">$ ${E(P(s.fmt))}</span></a>`).join('');
  $('#webt').innerHTML=OKP.webTable();
  const t=OK.OSS.find(o=>o.store);
  const card=o=>`<a class="oc k-${o.c}" href="${o.url}" target="_blank" rel="noopener"><div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">${E(o.dom)}</span></div><div class="shot"><img src="img/${o.img}-d.jpg" alt="${E(o.name)}, página inicial" loading="lazy"></div></div><div class="row"><h3>${E(o.name)}</h3><span class="pl">${E(o.plat)}</span></div><p>${E(P(o.d))}</p></a>`;
  const by=n=>OK.OSS.find(o=>o.name===n);
  const sn=by('Okami Sentinel'),ok=by('OkTally');
  $('#ogrid').innerHTML=`<div class="tally"><div class="phone"><img src="img/tally-m.jpg" alt="Okami Tally no iPhone" loading="lazy"></div><div><span class="tg">★ ${E(t.plat)}</span><h3>${E(t.name)}</h3><p>${E(P(t.d))}</p>${OKP.store(t)}</div></div>`+
    ['Okami Agent','Okami Monitor','OkamiCode','Okami Maturity'].map(n=>card(by(n))).join('')+
    `<a class="oc txt k-${ok.c}" href="${ok.url}" target="_blank" rel="noopener"><div><div class="row" style="margin-top:0"><h3>${E(ok.name)}</h3><span class="pl">${E(ok.plat)}</span></div><p style="margin-top:12px">${E(P(ok.d))}</p></div><span class="go">github.com/OkamiOps ↗</span></a>`+
    card(by('OkamiUNI'))+
    `<a class="sent" href="${sn.url}" target="_blank" rel="noopener"><div><span class="tg">★ ${E(sn.plat)} · AppSec</span><h3>${E(sn.name)}</h3><p>${E(P(sn.d))}</p><span class="btn btn-o">${OK.t('open')} ${E(sn.dom)} ↗</span></div><div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">${E(sn.dom)}</span></div><div class="shot"><img src="img/sentinel-d.jpg" alt="Okami Sentinel, página inicial" loading="lazy"></div></div></a>`+
    `<a class="ghw" href="https://github.com/OkamiOps" target="_blank" rel="noopener"><b>github.com/OkamiOps</b><span>7 open-source · 1 iOS · ${OK.t('open')} ↗</span></a>`;
  $('#ilist').innerHTML=OK.INSIGHTS.map((n,i)=>`<button type="button" role="tab" class="k-${n.c}" aria-selected="${i===isel}"><span class="lb">${E(n.cat)} · ${E(P(n.date))} · ${n.min} min</span><span class="big">${E(n.big)}<small>${E(n.unit)}</small></span><span class="t">${E(P(n.t))}</span></button>`).join('');
  document.querySelectorAll('#ilist button').forEach((b,i)=>{const go=()=>{if(isel!==i){isel=i;ishow()}};b.addEventListener('mouseenter',go);b.addEventListener('focus',go);b.addEventListener('click',go)});
  ishow();
  $('#rules').innerHTML=OKP.rules();
  $('#rail').innerHTML=CH.map(c=>{const n=OK.t(NAMES[c.id]).replace(/<[^>]+>/g,'');return `<a href="#${c.id}" class="${c.dataset.r}" aria-label="${n}"><span>${n}</span></a>`}).join('');
  fit();
}
function fit(){const vh=innerHeight;CH.forEach(c=>{c.style.top=innerWidth>900?Math.min(68,vh-c.offsetHeight)+'px':''})}
function onScroll(){
  const vh=innerHeight;let cur=0;
  CH.forEach((c,i)=>{
    const nx=CH[i+1];let p=0;
    if(nx&&innerWidth>900){const t=nx.getBoundingClientRect().top;p=Math.min(1,Math.max(0,1-(t-68)/(vh-68)))}
    c.style.setProperty('--dim',(p*.5).toFixed(3));
    c.querySelector(':scope>.wrap').style.setProperty('--sc',(1-p*.04).toFixed(4));
    if(c.getBoundingClientRect().top<vh*.5)cur=i;
  });
  document.querySelectorAll('#rail a').forEach((a,i)=>a.classList.toggle('on',i===cur));
  $('#rail').style.opacity=CH[0].getBoundingClientRect().top<vh*.6?1:0;
}
OK.onLang(render);
OK.init();
OKP.heroWire();
HEROES.init();
OKP.burger();
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{fit();onScroll()});
onScroll();
document.fonts&&document.fonts.ready.then(()=>{fit();onScroll()});
addEventListener('load',()=>{fit();onScroll()});
</script>
