<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkamiOps · Circuito</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="modes.css">
<style>
/* Layout: a linguagem é o circuito do logo. Noite = placa viva (traços animados). Papel = blueprint (traços em tinta). Seções alternam. */
.S{position:relative;padding-block:clamp(96px,10vw,150px)}
.S.paper{background:var(--paper);color:var(--ink-soft)}
.S.paper::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(20,20,26,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(20,20,26,.06) 1px,transparent 1px);background-size:32px 32px;pointer-events:none}
.S.night{background:var(--night);color:var(--fg-soft)}
.S .wrap{position:relative;z-index:1}
.sh{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:end;margin-bottom:clamp(48px,6vw,80px)}
.sh .kicker{color:var(--k-ink)} .night .sh .kicker{color:var(--k)}
.sh h2{font:400 clamp(48px,6.4vw,104px)/.92 var(--serif);color:var(--ink);letter-spacing:-.04em;margin-top:18px}
.sh h2 em{font-style:italic;color:var(--k-ink)}
.night .sh h2{font:500 clamp(36px,4.8vw,78px)/1 var(--mono);color:var(--fg);letter-spacing:-.06em}
.night .sh h2 em{font-style:normal;color:var(--k)}
.sh p{font-size:18px;max-width:520px}
.night .sh p{font:400 15px/1.75 var(--mono)}

/* hero vivo */
.hero{position:relative;background:var(--night);overflow:hidden;isolation:isolate}
#cv{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);gap:40px;align-items:center;padding-block:clamp(72px,9vw,128px)}
.hero .kicker{color:var(--c)}
.hero h1{margin-top:24px}
.hero h1 .a{display:block;font:400 clamp(60px,9vw,156px)/.86 var(--serif);color:var(--paper);letter-spacing:-.05em}
.hero h1 .a em{font-style:italic;color:var(--o)}
.hero h1 .b{display:block;margin-top:18px;font:500 clamp(30px,4.2vw,70px)/1.02 var(--mono);color:var(--fg);letter-spacing:-.06em}
.hero h1 .b em{font-style:normal;color:var(--c)}
.hero p{font-size:18px;max-width:520px;margin:28px 0 30px}
.acts{display:flex;gap:12px;flex-wrap:wrap}
.core{justify-self:center;width:clamp(200px,24vw,340px);position:relative}
.core .emblem{width:100%;box-shadow:0 0 0 10px rgba(6,6,10,.8),0 0 120px -10px rgba(63,216,212,.35)}
.core small{position:absolute;left:50%;top:calc(100% + 26px);transform:translateX(-50%);white-space:nowrap;font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--fg-mute)}

/* produtos: hub + trilhas */
.pcb{position:relative;display:grid;grid-template-columns:minmax(0,1fr) clamp(180px,18vw,240px) minmax(0,1fr);grid-template-rows:auto auto;gap:56px clamp(56px,7vw,110px);align-items:center}
.pcb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.pcb path{fill:none;stroke-width:2;stroke-linecap:round;stroke-dasharray:var(--len,800);stroke-dashoffset:var(--len,800);transition:stroke-dashoffset 1.6s cubic-bezier(.4,0,.2,1)}
.pcb.on path{stroke-dashoffset:0}
.pcb circle{transition:opacity .4s 1.2s;opacity:0}
.pcb.on circle{opacity:1}
.hub{grid-column:2;grid-row:1/3;display:grid;justify-items:center;gap:14px;text-align:center;z-index:1}
.hub .emblem{width:100%}
.hub b{font:500 13px var(--mono);color:var(--ink)}
.hub span{font:400 12px var(--mono);color:var(--ink-soft)}
.pc{position:relative;z-index:1;display:flex;flex-direction:column;gap:10px;padding:26px;border:1.5px solid var(--ink);border-radius:6px;background:#fbfaf7;transition:transform .3s,box-shadow .3s}
.pc:hover{transform:translateY(-4px);box-shadow:6px 6px 0 var(--k)}
.pc .led{display:flex;align-items:center;gap:8px;font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--k-ink)}
.pc .led::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--k);box-shadow:0 0 0 3px color-mix(in srgb,var(--k) 25%,transparent)}
.pc h3{font:400 clamp(40px,4.2vw,68px)/.92 var(--serif);color:var(--ink);letter-spacing:-.035em}
.pc .dm{font:500 13px var(--mono);color:var(--ink)}
.pc p{font-size:15px}
.k-p{--k:var(--ink);--k-ink:var(--ink)}

/* serviços: barramento */
.bus{position:relative;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;padding-top:44px}
.bus::before{content:"";position:absolute;left:0;right:0;top:12px;height:2px;background:linear-gradient(90deg,var(--o),var(--o) 25%,var(--c) 25%,var(--c) 50%,var(--o) 50%,var(--o) 75%,var(--c) 75%)}
.bus .pulse{position:absolute;top:7px;left:0;width:12px;height:12px;border-radius:50%;background:var(--fg);box-shadow:0 0 18px 4px rgba(63,216,212,.7);animation:bus 5s linear infinite}
@keyframes bus{to{left:calc(100% - 12px)}}
.node{position:relative;display:flex;flex-direction:column;gap:10px;padding:24px;border:1px solid var(--line);border-radius:12px;background:var(--night-1);transition:border-color .25s,transform .25s}
.node::before{content:"";position:absolute;left:24px;top:-34px;width:2px;height:34px;background:var(--k)}
.node::after{content:"";position:absolute;left:18px;top:-40px;width:12px;height:12px;border-radius:50%;border:2px solid var(--k);background:var(--night)}
.node:hover{border-color:var(--k);transform:translateY(-4px)}
.node .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--k)}
.node h3{font:500 22px/1.15 var(--mono);color:var(--fg);letter-spacing:-.03em}
.node p{font-size:15px;flex:1}
.node .io{font:400 12.5px var(--mono);color:var(--fg);padding-top:12px;border-top:1px dashed var(--line)}
.webrow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:center;margin-top:clamp(64px,7vw,104px)}
.webrow .kicker{color:var(--c)}
.webrow h3{font:400 clamp(36px,4vw,60px)/.98 var(--serif);color:var(--paper);letter-spacing:-.03em;margin:16px 0}
.webrow h3 em{font-style:italic;color:var(--c)}

/* comunidade: chips */
.chips{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:40px 28px}
.ic{display:flex;flex-direction:column;gap:14px;min-width:0}
.chip{position:relative;margin-inline:12px;padding:24px 18px 20px;border-radius:8px;background:#16161f;color:var(--fg);min-height:150px;display:flex;flex-direction:column;justify-content:space-between;transition:transform .3s,box-shadow .3s;box-shadow:0 2px 0 #000}
.chip::before,.chip::after{content:"";position:absolute;top:18px;bottom:18px;width:11px;background:repeating-linear-gradient(180deg,#a3a4b5 0 6px,transparent 6px 15px)}
.chip::before{left:-11px} .chip::after{right:-11px}
.chip .notch{position:absolute;top:0;left:50%;width:24px;height:12px;margin-left:-12px;border-radius:0 0 12px 12px;background:var(--paper)}
.chip .pl{display:flex;align-items:center;gap:8px;font:500 10.5px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--fg-mute)}
.chip .pl::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--k);transition:box-shadow .3s}
.chip b{font:700 clamp(18px,1.6vw,22px)/1.1 var(--mono);letter-spacing:-.03em;overflow-wrap:anywhere}
.chip .dm{font:400 11px var(--mono);color:var(--fg-mute);overflow-wrap:anywhere}
.ic p{font-size:14.5px;color:var(--ink-soft)}
.ic:hover .chip{transform:translateY(-6px);box-shadow:0 18px 30px -16px rgba(0,0,0,.6)}
.ic:hover .chip .pl::before{box-shadow:0 0 0 4px color-mix(in srgb,var(--k) 30%,transparent),0 0 16px var(--k)}
.ic.big{grid-column:span 2}
.ic.big .chip{min-height:200px;background:var(--night)}
.ic.big .chip b{font-size:clamp(30px,3vw,46px)}
.ic.big .chip .q-row{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 22px;margin-top:16px}
.ic .store{align-self:flex-start;margin-left:12px}

/* insights: leituras */
.reads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
.rd{display:flex;flex-direction:column;gap:12px;padding:26px;border:1px solid var(--line);border-radius:12px;background:var(--night-1);transition:border-color .25s}
.rd:hover{border-color:var(--k)}
.rd svg{width:100%;height:56px}
.rd svg polyline{fill:none;stroke:var(--k);stroke-width:2}
.rd .big{font:500 clamp(44px,4.4vw,70px)/.95 var(--mono);color:var(--k);letter-spacing:-.06em}
.rd .big small{font-size:.38em;color:var(--fg-mute);letter-spacing:0}
.rd .lb{font:400 12px var(--mono);color:var(--fg-mute)}
.rd h3{font:500 18px/1.3 var(--sans);color:var(--fg);flex:1}
.rd .go{font:500 12.5px var(--mono);color:var(--fg)}

/* empresa: datasheet */
.ds{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.ds .mani{font:400 clamp(44px,5.6vw,92px)/.92 var(--serif);color:var(--ink);letter-spacing:-.04em}
.ds .mani em{font-style:italic;color:var(--o-ink)}
.ds .sub{font-size:18px;margin:22px 0 28px;max-width:520px}
.sheet{border:1.5px solid var(--ink);border-radius:6px;background:#fbfaf7}
.sheet .h{display:flex;justify-content:space-between;padding:12px 18px;border-bottom:1.5px solid var(--ink);font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink)}
.sheet .r{display:grid;grid-template-columns:64px minmax(0,1fr);gap:16px;padding:16px 18px;border-bottom:1px solid var(--paper-line)}
.sheet .r:last-child{border-bottom:0}
.sheet .r span{font:500 11px var(--mono);color:var(--o-ink);padding-top:3px}
.sheet .r b{display:block;font:500 16px var(--sans);color:var(--ink)}
.sheet .r em{font-style:normal;font-size:14px}
.est{display:flex;gap:32px;flex-wrap:wrap}
.est div{display:grid;font:400 12px var(--mono);color:var(--ink-soft)}
.est b{font:400 48px/1 var(--serif);color:var(--ink)}

/* contato */
.ctg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.ctg h2{font:400 clamp(56px,8vw,136px)/.88 var(--serif);color:var(--paper);letter-spacing:-.05em;margin:18px 0 24px}
.ctg h2 em{font-style:italic;color:var(--o)}
.ctg .kicker{color:var(--o)}
.ctg .copyrow{color:var(--fg);margin-top:12px} .ctg .copyrow small{color:var(--fg-mute)}
.ctg form{display:grid;gap:16px;padding:30px;border:1px solid var(--line);border-radius:14px;background:var(--night-1)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ctg form .btn{justify-self:start;border-radius:8px}

@media (max-width:1060px){
  .hero .wrap,.sh,.webrow,.ds,.ctg{grid-template-columns:1fr}
  .core{width:200px;order:-1;justify-self:start}
  .core small{display:none}
  .pcb{grid-template-columns:1fr;gap:20px}
  .pcb svg{display:none}
  .hub{grid-column:1;grid-row:auto;grid-template-columns:72px 1fr;justify-items:start;text-align:left;align-items:center}
  .hub .emblem{width:72px}
  .pc{border-left:4px solid var(--k)}
  .bus{grid-template-columns:repeat(2,minmax(0,1fr));row-gap:64px}
  .chips{grid-template-columns:repeat(2,minmax(0,1fr))}
  .reads{grid-template-columns:1fr}
}
@media (max-width:640px){
  .bus{grid-template-columns:1fr}
  .chips{grid-template-columns:1fr}
  .ic.big{grid-column:auto}
  .ic.big .chip .q-row{grid-template-columns:1fr}
  .f2{grid-template-columns:1fr}
  .acts .btn{flex:1 1 100%}
}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="top">
  <section class="hero" id="hero">
    <canvas id="cv" aria-hidden="true"></canvas>
    <div class="wrap">
      <div>
        <span class="kicker"><span class="dot"></span>&nbsp; OkamiOps · <span data-i="where"></span></span>
        <h1><span class="a" data-i="hero_l"></span><span class="b" data-i="hero_r"></span></h1>
        <p data-i="hero_lp"></p>
        <div class="acts"><a class="btn btn-o" href="#contato" data-i="cta"></a><a class="btn btn-line-n" href="#produtos" data-i="see_all"></a></div>
      </div>
      <div class="core" id="core"><div class="emblem"><img src="wolf.png" alt=""></div><small data-i="hub"></small></div>
    </div>
  </section>

  <section class="S paper k-o" id="produtos"><div class="wrap">
    <div class="sh"><div><span class="kicker">01 · <span data-i="prod_k"></span></span><h2 data-i="prod_h"></h2></div><p data-i="prod_p"></p></div>
    <div class="pcb" id="pcb"><svg id="traces" aria-hidden="true"></svg></div>
  </div></section>

  <section class="S night k-c" id="servicos"><div class="wrap">
    <div class="sh"><div><span class="kicker">02 · <span data-i="serv_k"></span></span><h2 data-i="serv_h"></h2></div><div style="display:grid;gap:22px;justify-items:start"><p data-i="serv_p"></p><a class="btn btn-o" data-href="/servicos/" target="_blank" rel="noopener" data-i="plans"></a></div></div>
    <div class="bus" id="bus"></div>
    <div class="webrow"><div><span class="kicker" data-i="web_k"></span><h3 data-i="web_h"></h3><p data-i="web_p"></p><a class="btn btn-o" style="margin-top:22px" data-href="/agents/" target="_blank" rel="noopener" data-i="web_cta"></a></div><div id="webt"></div></div>
  </div></section>

  <section class="S paper k-m" id="comunidade"><div class="wrap">
    <div class="sh"><div><span class="kicker">03 · <span data-i="comu_k"></span></span><h2 data-i="comu_h"></h2></div><p data-i="comu_p"></p></div>
    <div class="chips" id="chips"></div>
  </div></section>

  <section class="S night k-o" id="insights"><div class="wrap">
    <div class="sh"><div><span class="kicker">04 · <span data-i="ins_k"></span></span><h2 data-i="ins_h"></h2></div><div style="display:grid;gap:22px;justify-items:start"><p data-i="ins_p"></p><a class="btn btn-line-n" data-href="/insights/" target="_blank" rel="noopener" data-i="all_ins"></a></div></div>
    <div class="reads" id="reads"></div>
  </div></section>

  <section class="S paper k-o" id="empresa"><div class="wrap ds">
    <div><span class="kicker" style="color:var(--o-ink)">05 · <span data-i="emp_k"></span></span><h2 class="mani" style="margin-top:18px" data-i="emp_h"></h2><p class="sub" data-i="emp_p"></p>
      <div class="est"><div><b>20+</b><span data-i="yrs_tech"></span></div><div><b>10+</b><span data-i="yrs_sec"></span></div><div><b>BR·DE</b><span data-i="stat_ops"></span></div></div>
      <a class="btn btn-line-p" style="margin-top:28px" data-href="/empresa/" target="_blank" rel="noopener" data-i="emp_more"></a></div>
    <div class="sheet"><div class="h"><span>okamiops · datasheet</span><span data-i="emp_rules"></span></div><div id="sheet"></div></div>
  </div></section>

  <section class="S night" id="contato"><div class="wrap ctg">
    <div><span class="kicker">06 · <span data-i="ct_k"></span></span><h2 data-i="ct_h"></h2><p style="font-size:18px;max-width:480px" data-i="ct_p"></p>
      <div class="copyrow" style="margin-top:28px"><small data-i="sales"></small><span>contato@okamiops.com</span><button type="button" data-copy="contato@okamiops.com" data-i="copy"></button></div>
      <div class="copyrow"><small>disclosure</small><span>security@okamiops.com</span><button type="button" data-copy="security@okamiops.com" data-i="copy"></button></div></div>
    <form data-demo>
      <div class="f2"><div class="field"><label for="f1" data-i="f_name"></label><input id="f1" autocomplete="name" required></div><div class="field"><label for="f2" data-i="f_email"></label><input id="f2" type="email" autocomplete="email" required></div></div>
      <div class="field"><label for="f3" data-i="f_company"></label><input id="f3" autocomplete="organization"></div>
      <div class="field"><label for="f4" data-i="f_msg"></label><textarea id="f4" rows="4" required></textarea></div>
      <button class="btn btn-o" type="submit" data-i="f_send"></button><p class="note" data-note hidden></p>
    </form>
  </div></section>
</main>
<div id="ft"></div>

<script src="okami.js"></script>
<script src="parts.js"></script>
<script src="extra.js"></script>
<script>
const $=s=>document.querySelector(s),E=OK.esc,P=OK.pick;
$('#hdr').outerHTML=OKP.header();
$('#ft').outerHTML=OKP.footer();
const COL={o:'#ff7a3d',c:'#3fd8d4',m:'#ff3fb0',p:'#14141a'};
const WAVES=['0,40 30,40 40,12 50,52 60,40 120,40 130,20 140,40 300,40','0,30 40,30 60,50 80,10 100,30 300,30','0,44 80,44 90,8 100,44 300,44'];

function render(){
  // produtos
  const pos=[[1,1],[1,2],[3,1],[3,2]];
  $('#pcb').innerHTML='<svg id="traces" aria-hidden="true"></svg>'+`<div class="hub"><div class="emblem"><img src="wolf.png" alt=""></div><div><b>OkamiOps</b><br><span data-i="hub">${OK.t('hub')}</span></div></div>`+
    OK.PRODUCTS.map((p,i)=>`<a class="pc k-${p.c}" style="grid-column:${pos[i][0]};grid-row:${pos[i][1]}" href="${p.url}" target="_blank" rel="noopener"><span class="led">${E(P(p.kind))} · ${OK.t('online')}</span><h3>${E(p.name)}</h3><span class="dm">${E(p.dom)}</span><p>${E(P(p.d))}</p></a>`).join('');
  // serviços
  $('#bus').innerHTML='<span class="pulse" aria-hidden="true"></span>'+OK.SERVICES.map(s=>`<a class="node k-${s.c}" href="${OK.link(s.path)}" target="_blank" rel="noopener"><span class="tg">${s.tag}</span><h3>${E(P(s.name))}</h3><p>${E(P(s.d))}</p><span class="io">$ ${E(P(s.fmt))}</span></a>`).join('');
  $('#webt').innerHTML=OKP.webTable();
  // comunidade
  const t=OK.OSS.find(o=>o.store);
  $('#chips').innerHTML=`<div class="ic big k-c"><div class="chip"><span class="notch"></span><span class="pl">${E(t.plat)}</span><b>${E(t.name)}</b><div class="q-row">${OKP.quotas()}</div></div><p>${E(P(t.d))}</p>${OKP.store(t)}</div>`+
    OK.OSS.filter(o=>!o.store).map(o=>`<a class="ic k-${o.c}" href="${o.url}" target="_blank" rel="noopener"><div class="chip"><span class="notch"></span><span class="pl">${E(o.plat)}</span><b>${E(o.name)}</b><span class="dm">${E(o.dom)}</span></div><p>${E(P(o.d))}</p></a>`).join('')+
    `<a class="ic k-m" href="https://github.com/OkamiOps" target="_blank" rel="noopener"><div class="chip" style="background:var(--m);color:var(--night)"><span class="notch"></span><span class="pl" style="color:var(--night)">GitHub</span><b>OkamiOps</b><span class="dm" style="color:var(--night)">github.com/OkamiOps</span></div><p>${E(OK.t('comu_p'))}</p></a>`;
  // insights
  $('#reads').innerHTML=OK.INSIGHTS.map((n,i)=>`<a class="rd k-${n.c}" href="${OK.link(n.path)}" target="_blank" rel="noopener"><span class="lb">${E(n.cat)} · ${E(P(n.date))}</span><svg viewBox="0 0 300 60" preserveAspectRatio="none" aria-hidden="true"><polyline points="${WAVES[i]}"/></svg><span class="big">${E(n.big)}<small>${E(n.unit)}</small></span><span class="lb">${E(P(n.lab))}</span><h3>${E(P(n.t))}</h3><span class="go">${OK.t('read')} · ${n.min} min →</span></a>`).join('');
  $('#sheet').innerHTML=OK.RULES.map((r,i)=>`<div class="r"><span>PIN ${String(i+1).padStart(2,'0')}</span><div><b>${E(P(r[0]))}</b><em>${E(P(r[1]))}</em></div></div>`).join('');
  requestAnimationFrame(drawTraces);
}

// trilhas do hub até cada produto
function drawTraces(){
  const pcb=$('#pcb'),svg=$('#traces');if(!pcb||!svg)return;
  if(getComputedStyle(svg).display==='none')return;
  const R=pcb.getBoundingClientRect(),hub=pcb.querySelector('.hub .emblem').getBoundingClientRect();
  const hx=hub.left+hub.width/2-R.left,hy=hub.top+hub.height/2-R.top,hr=hub.width/2;
  svg.setAttribute('viewBox',`0 0 ${R.width} ${R.height}`);
  let out='';
  pcb.querySelectorAll('.pc').forEach((c,i)=>{
    const b=c.getBoundingClientRect(),left=b.left-R.left<hx;
    const ex=left?b.right-R.left:b.left-R.left, ey=b.top-R.top+b.height/2;
    const sx=hx+(left?-hr:hr), sy=hy+(ey<hy?-hr*.45:hr*.45);
    const mid=(sx+ex)/2, d=Math.min(Math.abs(ey-sy),Math.abs(mid-ex)*.9);
    const path=`M${sx},${sy} H${mid+(left?d*.0:0)} L${mid+(left?-1:1)*0},${sy} L${mid+(left?-d:d)},${ey} H${ex}`;
    const k=OK.PRODUCTS[i].c, col=k==='p'?'#14141a':COL[k];
    out+=`<path d="M${sx},${sy} H${left?mid+d:mid-d} L${mid},${ey} H${ex}" stroke="${col}"/><circle cx="${sx}" cy="${sy}" r="5" fill="#f4f2ee" stroke="${col}" stroke-width="2"/><circle cx="${ex}" cy="${ey}" r="5" fill="#f4f2ee" stroke="${col}" stroke-width="2"/>`;
  });
  svg.innerHTML=out;
  svg.querySelectorAll('path').forEach(p=>{p.style.setProperty('--len',Math.ceil(p.getTotalLength()))});
}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add('on');io.unobserve(e.target)}}),{threshold:.25});
OK.onLang(render);
OK.init();
OKP.burger();
io.observe($('#pcb'));
let rz;addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{drawTraces();sizeCv()},150)});

// circuito vivo do hero
const cv=$('#cv'),ctx=cv.getContext('2d'),hero=$('#hero');let W,H,DPR,traces=[],mouse={x:-999,y:-999};
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
function sizeCv(){DPR=Math.min(devicePixelRatio||1,2);W=hero.clientWidth;H=hero.clientHeight;cv.width=W*DPR;cv.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);build()}
function build(){
  const c=$('#core .emblem').getBoundingClientRect(),h=hero.getBoundingClientRect();
  const cx=c.left-h.left+c.width/2,cy=c.top-h.top+c.height/2,r=c.width/2+14;
  const cols=['#ff7a3d','#3fd8d4','#ff3fb0'];traces=[];
  const n=W<700?10:22;
  for(let i=0;i<n;i++){
    const a=(i/n)*Math.PI*2+.2, tx=cx+Math.cos(a)*r, ty=cy+Math.sin(a)*r;
    const side=Math.cos(a)>0?1:-1, sx=side>0?W+20:-20, sy=ty+(Math.random()-.5)*160;
    const bx=tx+side*(40+Math.random()*120);
    const pts=[[sx,sy],[bx+side*Math.abs(sy-ty),sy],[bx,ty],[tx,ty]];
    let len=0;for(let j=1;j<pts.length;j++)len+=Math.hypot(pts[j][0]-pts[j-1][0],pts[j][1]-pts[j-1][1]);
    traces.push({pts,len,col:cols[i%3],t0:Math.random()*1200,sp:.00006+Math.random()*.00008,ph:Math.random()});
  }
}
function at(tr,f){let d=f*tr.len;for(let j=1;j<tr.pts.length;j++){const a=tr.pts[j-1],b=tr.pts[j],s=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d<=s){const k=d/s;return[a[0]+(b[0]-a[0])*k,a[1]+(b[1]-a[1])*k]}d-=s}return tr.pts[tr.pts.length-1]}
let start=null;
function frame(ts){
  if(!start)start=ts;const T=ts-start;ctx.clearRect(0,0,W,H);
  traces.forEach(tr=>{
    const grow=reduce?1:Math.min(1,Math.max(0,(T-tr.t0)/1600));
    const near=Math.hypot(mouse.x-tr.pts[2][0],mouse.y-tr.pts[2][1])<220;
    ctx.globalAlpha=near?.95:.45;ctx.strokeStyle=tr.col;ctx.lineWidth=near?2:1.4;ctx.beginPath();
    let d=grow*tr.len;ctx.moveTo(tr.pts[0][0],tr.pts[0][1]);
    for(let j=1;j<tr.pts.length;j++){const a=tr.pts[j-1],b=tr.pts[j],s=Math.hypot(b[0]-a[0],b[1]-a[1]);if(d>=s){ctx.lineTo(b[0],b[1]);d-=s}else{ctx.lineTo(a[0]+(b[0]-a[0])*d/s,a[1]+(b[1]-a[1])*d/s);break}}
    ctx.stroke();
    if(grow>=1){const e=tr.pts[tr.pts.length-1];ctx.globalAlpha=1;ctx.fillStyle='#060609';ctx.beginPath();ctx.arc(e[0],e[1],4,0,7);ctx.fill();ctx.stroke();
      if(!reduce){const f=((T*tr.sp)+tr.ph)%1,p=at(tr,f);ctx.fillStyle=tr.col;ctx.shadowColor=tr.col;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p[0],p[1],2.6,0,7);ctx.fill();ctx.shadowBlur=0}}
  });
  ctx.globalAlpha=1;
  if(!reduce)requestAnimationFrame(frame);
}
hero.addEventListener('pointermove',e=>{const r=hero.getBoundingClientRect();mouse.x=e.clientX-r.left;mouse.y=e.clientY-r.top;if(reduce)frame(performance.now())});
hero.addEventListener('pointerleave',()=>{mouse.x=-999});
sizeCv();requestAnimationFrame(frame);
document.fonts&&document.fonts.ready.then(()=>{sizeCv();drawTraces()});
</script>
