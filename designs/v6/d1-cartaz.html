<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkamiOps · Cartaz</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="modes.css">
<style>
/* Layout: cada seção é um pôster com tipografia gigante. Papel (lobo) e noite (máquina) se alternam; um assunto por tela. */
.P{position:relative;padding-block:clamp(96px,11vw,170px)}
.P.paper{background:var(--paper);color:var(--ink-soft)}
.P.night{background:var(--night);color:var(--fg-soft)}
.P .wrap{position:relative;z-index:1}
.lab{display:flex;justify-content:space-between;align-items:baseline;gap:20px;font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;padding-bottom:16px;margin-bottom:clamp(40px,5vw,72px);border-bottom:1px solid currentColor}
.paper .lab{color:var(--ink)} .night .lab{color:var(--fg-mute);border-color:var(--line)}
.lab b{font-weight:500}
.paper .lab b{color:var(--k-ink)} .night .lab b{color:var(--k)}

/* hero: corte diagonal */
.hero{position:relative;background:var(--night);overflow:hidden}
.h-top{background:var(--paper);padding-block:clamp(56px,7vw,96px) clamp(140px,16vw,240px)}
.h-top .kicker{color:var(--o-ink)}
.h-top h1{font:400 clamp(72px,14.5vw,250px)/.82 var(--serif);color:var(--ink);letter-spacing:-.055em;margin-top:22px}
.h-top h1 em{font-style:italic;color:var(--o-ink)}
.h-bot{position:relative;background:var(--night);margin-top:calc(-1 * clamp(110px,13vw,200px));clip-path:polygon(0 clamp(70px,9vw,140px),100% 0,100% 100%,0 100%);padding-block:clamp(150px,14vw,210px) clamp(64px,7vw,96px)}
.h-bot::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:56px 56px;opacity:.3}
.h-bot .wrap{position:relative;display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.2fr);gap:48px;align-items:end}
.h-bot h1{grid-column:2;grid-row:1;font:500 clamp(40px,6.6vw,116px)/.98 var(--mono);color:var(--fg);letter-spacing:-.06em;text-align:right}
.h-bot h1 em{font-style:normal;color:var(--c)}
.h-bot .side{grid-column:1;grid-row:1;display:grid;gap:24px}
.h-bot .side p{font-size:18px;color:var(--fg-soft)}
.h-emb{position:absolute;z-index:3;left:0;top:0;width:clamp(110px,10vw,170px);transform:translate(-50%,-50%)}
.acts{display:flex;gap:12px;flex-wrap:wrap}

/* produtos: nomes gigantes vazados */
.plist{display:grid}
.pn{position:relative;display:grid;grid-template-columns:minmax(0,1fr) auto;align-items:baseline;gap:24px;padding-block:6px;border-bottom:1px solid var(--line)}
.pn .nm{font:400 clamp(64px,12.5vw,214px)/.95 var(--serif);letter-spacing:-.05em;color:transparent;-webkit-text-stroke:1.5px #5c5c74;transition:color .35s,-webkit-text-stroke-color .35s,letter-spacing .5s}
.pn .mt{display:grid;justify-items:end;gap:4px;font:500 12px var(--mono);color:var(--fg-mute);text-align:right}
.pn .mt b{font-weight:500;color:var(--fg)}
.pn:hover .nm,.pn:focus-visible .nm{color:var(--k);-webkit-text-stroke-color:var(--k);font-style:italic;letter-spacing:-.06em}
.pn .ds{display:none}
.pv{position:fixed;z-index:70;left:0;top:0;width:300px;padding:20px;border-radius:14px;background:var(--paper);color:var(--ink-soft);pointer-events:none;opacity:0;transform:translate(-50%,-50%) scale(.9);transition:opacity .2s,transform .2s;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.pv.on{opacity:1;transform:translate(18px,18px) scale(1)}
.pv .d{font:500 12px var(--mono);color:var(--k-ink)}
.pv p{font-size:15px;margin:8px 0 12px;color:var(--ink)}
.pv span{font:500 12px var(--mono);color:var(--ink)}
.k-p{--k:var(--fg)}
.pfoot em{color:var(--o)}
@media (max-width:760px){.pfoot{grid-template-columns:1fr!important}}

/* marquee */
.mq{overflow:hidden;background:var(--o);color:var(--night);padding-block:16px;border-block:1px solid var(--night)}
.mq .t{display:flex;width:max-content;gap:28px;font:500 clamp(18px,2vw,26px) var(--mono);letter-spacing:-.02em;animation:mq 40s linear infinite;white-space:nowrap}
@keyframes mq{to{transform:translateX(-50%)}}
.mq:hover .t{animation-play-state:paused}

/* serviços */
.big-h{font:400 clamp(52px,8vw,136px)/.9 var(--serif);color:var(--ink);letter-spacing:-.045em;max-width:14ch}
.big-h em{font-style:italic;color:var(--c-ink)}
.svc{margin-top:clamp(48px,6vw,88px);border-top:2px solid var(--ink)}
.svc a{display:grid;grid-template-columns:80px minmax(0,1fr) minmax(0,.9fr) 48px;gap:28px;align-items:center;padding-block:28px;border-bottom:1px solid var(--paper-line)}
.svc .n{font:500 13px var(--mono);color:var(--k-ink)}
.svc h3{font:400 clamp(36px,4.6vw,72px)/1 var(--serif);color:var(--ink);letter-spacing:-.03em;transition:transform .35s}
.svc p{font-size:16px}
.svc .ar{font:500 22px var(--mono);color:var(--ink);transition:transform .3s}
.svc a:hover h3{transform:translateX(14px);font-style:italic;color:var(--k-ink)}
.svc a:hover .ar{transform:translateX(6px) rotate(-45deg);color:var(--k-ink)}
.webbox{margin-top:clamp(56px,6vw,88px);display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;align-items:center;padding:clamp(28px,4vw,48px);border-radius:20px;background:var(--night);color:var(--fg-soft)}
.webbox .kicker{color:var(--c)}
.webbox h3{font:500 clamp(28px,3vw,44px)/1.05 var(--mono);color:var(--fg);letter-spacing:-.05em;margin:16px 0}
.webbox h3 em{font-style:normal;color:var(--c)}

/* comunidade */
.night .big-h{color:var(--fg);font-family:var(--mono);font-weight:500;font-size:clamp(40px,6vw,100px);letter-spacing:-.06em;line-height:.98;max-width:16ch}
.night .big-h em{font-style:normal;color:var(--m)}
.tally{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:center;margin-top:clamp(48px,6vw,88px)}
.tally .tg{font:500 12px var(--mono);color:var(--c)}
.tally h3{font:400 clamp(64px,8vw,140px)/.86 var(--serif);color:var(--fg);letter-spacing:-.05em;margin:14px 0 18px}
.tally p{font-size:17px;max-width:520px;margin-bottom:26px}
.phone{justify-self:center;width:min(300px,72vw);aspect-ratio:9/19;border-radius:48px;padding:12px;background:#1b1b26;box-shadow:0 0 0 1px #2c2c3d,0 60px 120px -40px rgba(63,216,212,.35);transform:rotate(-4deg)}
.scr{height:100%;border-radius:38px;background:var(--paper);padding:58px 22px 22px;display:flex;flex-direction:column;gap:18px;position:relative}
.scr::before{content:"";position:absolute;top:13px;left:50%;transform:translateX(-50%);width:90px;height:26px;border-radius:999px;background:#000}
.scr small{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.scr .pct{font:400 72px/.85 var(--serif);color:var(--ink);letter-spacing:-.04em}
.sq{display:grid;gap:6px;font:400 11px var(--mono);color:var(--ink)}
.sq span{display:flex;justify-content:space-between} .sq span em{font-style:normal;color:var(--ink-soft)}
.sq i{height:6px;border-radius:6px;background:linear-gradient(90deg,var(--k-ink) var(--w),var(--paper-2) var(--w))}
.rail-h{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:clamp(64px,7vw,104px) 0 22px}
.rail-h b{font:500 12px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--fg-mute)}
.rail-nav{display:flex;gap:8px}
.rail-nav button{width:44px;height:44px;border-radius:50%;border:1px solid #3a3a50;background:none;color:var(--fg);cursor:pointer;font:500 16px var(--mono)}
.rail-nav button:hover{border-color:var(--fg)}
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,320px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:12px;scrollbar-width:thin;scrollbar-color:#3a3a50 transparent}
.rc{scroll-snap-align:start;display:flex;flex-direction:column;gap:12px;min-height:340px;padding:26px;border-radius:18px;background:var(--paper);color:var(--ink-soft);transition:transform .3s}
.rc:hover{transform:translateY(-6px)}
.rc .pl{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--k-ink)}
.rc h4{font:400 42px/.95 var(--serif);color:var(--ink);letter-spacing:-.03em;margin:0}
.rc p{font-size:14.5px;flex:1}
.rc .dm{font:500 12px var(--mono);color:var(--ink);overflow-wrap:anywhere}
.rc.gh{background:var(--m);color:var(--night)} .rc.gh h4,.rc.gh .dm,.rc.gh .pl{color:var(--night)}

/* insights */
.nums{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3vw,48px);margin-top:clamp(48px,6vw,88px)}
.nm2{display:flex;flex-direction:column;gap:14px;padding-top:22px;border-top:2px solid var(--ink)}
.nm2 .big{font:400 clamp(64px,8.4vw,150px)/.85 var(--serif);letter-spacing:-.05em;color:var(--k-ink)}
.nm2 .big small{font-size:.32em;color:var(--ink-soft);letter-spacing:0}
.nm2 .lb{font:500 12px var(--mono);color:var(--ink-soft);text-transform:uppercase;letter-spacing:.08em}
.nm2 h3{font:500 20px/1.3 var(--sans);color:var(--ink)}
.nm2 .rd{font:500 13px var(--mono);color:var(--ink)}
.nm2:hover h3{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--k-ink)}

/* empresa */
.mani{font:400 clamp(52px,8.6vw,150px)/.9 var(--serif);color:var(--fg);letter-spacing:-.05em;max-width:12ch}
.mani em{font-style:italic;color:var(--o)}
.mani2{font:400 clamp(28px,3.6vw,56px)/1.12 var(--serif);color:var(--fg-soft);letter-spacing:-.02em;max-width:24ch;margin-top:clamp(28px,3vw,44px)}
.mani2 b{font-weight:400;font-style:italic}
.mani2 .o{color:var(--o)} .mani2 .c{color:var(--c)} .mani2 .m{color:var(--m)}
.est{display:flex;gap:clamp(28px,5vw,72px);flex-wrap:wrap;margin-top:clamp(48px,6vw,80px);padding-top:28px;border-top:1px solid var(--line);align-items:flex-end}
.est div{display:grid;font:400 13px var(--mono);color:var(--fg-mute)}
.est b{font:500 clamp(44px,5vw,72px)/1 var(--mono);color:var(--fg);letter-spacing:-.05em}
.est .btn{margin-left:auto}

/* contato */
.ct-h{font:400 clamp(64px,11vw,190px)/.86 var(--serif);color:var(--ink);letter-spacing:-.055em}
.ct-h em{font-style:italic;color:var(--o-ink)}
.ctg{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start;margin-top:clamp(40px,5vw,72px)}
.ctg .copyrow{color:var(--ink);margin-top:12px} .ctg .copyrow small{color:var(--ink-soft)}
.ctg form{display:grid;gap:16px;padding:32px;border-radius:20px;background:var(--night)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.ctg form .btn{justify-self:start;border-radius:8px}

@media (max-width:980px){
  .h-bot .wrap{grid-template-columns:1fr}
  .h-bot h1{grid-column:1;text-align:left}
  .h-bot .side{grid-row:2}
  .svc a{grid-template-columns:48px minmax(0,1fr) 32px;gap:12px 18px}
  .svc p{grid-column:2/3}
  .svc .ar{grid-row:1;grid-column:3}
  .webbox,.tally,.ctg{grid-template-columns:1fr}
  .nums{grid-template-columns:1fr}
  .pn .ds{display:block;grid-column:1/-1;font-size:14px;color:var(--fg-soft);margin:-4px 0 10px}
  .pv{display:none}
}
@media (max-width:640px){.h-emb{width:84px}.h-top{padding-bottom:170px}.pn .mt{display:none}.pn{grid-template-columns:1fr}.f2{grid-template-columns:1fr}.est .btn{margin-left:0}.ctg form{padding:22px}}
</style>
</head>
<body>
<div id="hdr"></div>
<main id="top">
  <section class="hero">
    <div class="h-top"><div class="wrap"><span class="kicker">OkamiOps · <span data-i="where"></span></span><h1 data-i="hero_l"></h1></div></div>
    <div class="h-bot"><div class="wrap">
      <h1 data-i="hero_r"></h1>
      <div class="side"><p data-i="hero_lp"></p><div class="acts"><a class="btn btn-o" href="#contato" data-i="cta"></a><a class="btn btn-line-n" href="#produtos" data-i="see_all"></a></div></div>
    </div></div>
    <div class="h-emb emblem" aria-hidden="true"><img src="wolf.png" alt=""></div>
  </section>

  <section class="P night k-o" id="produtos"><div class="wrap">
    <div class="lab"><span><b>01</b> · <span data-i="prod_k"></span></span><span><span class="dot"></span>&nbsp; 4 <span data-i="online"></span></span></div>
    <div class="plist" id="plist"></div>
    <div style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:40px;margin-top:40px;align-items:start" class="pfoot"><h2 style="font:400 clamp(30px,3.4vw,52px)/1.02 var(--serif);color:var(--fg);letter-spacing:-.02em" data-i="prod_h"></h2><p style="font-size:17px;max-width:520px" data-i="prod_p"></p></div>
  </div></section>

  <div class="mq" aria-hidden="true"><div class="t"><span data-i="marquee"></span><span data-i="marquee"></span><span data-i="marquee"></span><span data-i="marquee"></span></div></div>

  <section class="P paper k-c" id="servicos"><div class="wrap">
    <div class="lab"><span><b>02</b> · <span data-i="serv_k"></span></span><span data-i="serv_p" style="text-transform:none;letter-spacing:0;font-family:var(--sans);font-size:14px;max-width:420px;text-align:right"></span></div>
    <h2 class="big-h" data-i="serv_h"></h2>
    <div class="svc" id="svc"></div>
    <div class="webbox"><div><span class="kicker" data-i="web_k"></span><h3 data-i="web_h"></h3><p data-i="web_p"></p><a class="btn btn-o" style="margin-top:22px" data-href="/agents/" target="_blank" rel="noopener" data-i="web_cta"></a></div><div id="webt"></div></div>
  </div></section>

  <section class="P night k-m" id="comunidade"><div class="wrap">
    <div class="lab"><span><b>03</b> · <span data-i="comu_k"></span></span><span>github.com/OkamiOps</span></div>
    <h2 class="big-h" data-i="comu_h"></h2>
    <div class="tally" id="tally"></div>
    <div class="rail-h"><b data-i="comu_p" style="text-transform:none;letter-spacing:0;font:400 15px var(--sans);color:var(--fg-soft);max-width:560px"></b><div class="rail-nav"><button type="button" id="rp" aria-label="anterior">←</button><button type="button" id="rn" aria-label="próximo">→</button></div></div>
    <div class="rail" id="rail"></div>
  </div></section>

  <section class="P paper k-o" id="insights"><div class="wrap">
    <div class="lab"><span><b>04</b> · <span data-i="ins_k"></span></span><a data-href="/insights/" target="_blank" rel="noopener" data-i="all_ins"></a></div>
    <h2 class="big-h" data-i="ins_h"></h2>
    <div class="nums" id="nums"></div>
  </div></section>

  <section class="P night k-o" id="empresa"><div class="wrap">
    <div class="lab"><span><b>05</b> · <span data-i="emp_k"></span></span><span>BR · DE</span></div>
    <h2 class="mani" data-i="emp_h"></h2>
    <p class="mani2" data-i="emp_big"></p>
    <div class="est"><div><b>20+</b><span data-i="yrs_tech"></span></div><div><b>10+</b><span data-i="yrs_sec"></span></div><div><b>100%</b><span data-i="stat_ops"></span></div><a class="btn btn-line-n" data-href="/empresa/" target="_blank" rel="noopener" data-i="emp_more"></a></div>
  </div></section>

  <section class="P paper k-o" id="contato"><div class="wrap">
    <div class="lab"><span><b>06</b> · <span data-i="ct_k"></span></span><span data-i="where"></span></div>
    <h2 class="ct-h" data-i="ct_h"></h2>
    <div class="ctg">
      <div><p style="font-size:19px;max-width:480px" data-i="ct_p"></p>
        <div class="copyrow" style="margin-top:28px"><small data-i="sales"></small><span>contato@okamiops.com</span><button type="button" data-copy="contato@okamiops.com" data-i="copy"></button></div>
        <div class="copyrow"><small>disclosure</small><span>security@okamiops.com</span><button type="button" data-copy="security@okamiops.com" data-i="copy"></button></div></div>
      <form data-demo>
        <div class="f2"><div class="field"><label for="f1" data-i="f_name"></label><input id="f1" autocomplete="name" required></div><div class="field"><label for="f2" data-i="f_email"></label><input id="f2" type="email" autocomplete="email" required></div></div>
        <div class="field"><label for="f3" data-i="f_company"></label><input id="f3" autocomplete="organization"></div>
        <div class="field"><label for="f4" data-i="f_msg"></label><textarea id="f4" rows="4" required></textarea></div>
        <button class="btn btn-o" type="submit" data-i="f_send"></button><p class="note" data-note hidden></p>
      </form>
    </div>
  </div></section>
</main>
<div id="ft"></div>
<div class="pv" id="pv" aria-hidden="true"></div>

<script src="okami.js"></script>
<script src="parts.js"></script>
<script src="extra.js"></script>
<script>
const $=s=>document.querySelector(s),E=OK.esc,P=OK.pick;
$('#hdr').outerHTML=OKP.header();
$('#ft').outerHTML=OKP.footer();
function render(){
  $('#plist').innerHTML=OK.PRODUCTS.map((p,i)=>`<a class="pn k-${p.c}" href="${p.url}" target="_blank" rel="noopener" data-n="${i}"><span class="nm">${E(p.name)}</span><span class="mt"><b>${E(p.dom)}</b><span>${E(P(p.kind))} · ${E(P(p.model))}</span></span><span class="ds">${E(P(p.d))}</span></a>`).join('');
  document.querySelectorAll('.pn').forEach(a=>{
    a.addEventListener('pointerenter',()=>{const p=OK.PRODUCTS[a.dataset.n];const pv=$('#pv');pv.className='pv on k-'+p.c;pv.innerHTML=`<span class="d">${E(p.dom)}</span><p>${E(P(p.d))}</p><span>${OK.t('visit')} ↗</span>`});
    a.addEventListener('pointerleave',()=>$('#pv').classList.remove('on'));
  });
  $('#svc').innerHTML=OK.SERVICES.map((s,i)=>`<a class="k-${s.c}" href="${OK.link(s.path)}" target="_blank" rel="noopener"><span class="n">0${i+1} · ${s.tag}</span><h3>${E(P(s.name))}</h3><p>${E(P(s.d))}</p><span class="ar">→</span></a>`).join('');
  $('#webt').innerHTML=OKP.webTable();
  const t=OK.OSS.find(o=>o.store);
  $('#tally').innerHTML=`<div><span class="tg">★ ${E(t.plat)}</span><h3>${E(t.name)}</h3><p>${E(P(t.d))}</p><a class="store" style="background:var(--paper);color:var(--ink)" href="${t.url}" target="_blank" rel="noopener">${OKP.APPLE}<span>${OK.t('appstore_s')}<b>${OK.t('appstore_b')}</b></span></a></div>
    <div class="phone" aria-hidden="true"><div class="scr"><small>okami tally</small><span class="pct">72%</span>${OKP.QUOTAS.map(q=>`<div class="sq k-${q[2]}" style="--w:${q[1]}%"><span>${q[0]}<em>${q[1]}%</em></span><i></i></div>`).join('')}</div></div>`;
  $('#rail').innerHTML=OK.OSS.filter(o=>!o.store).map(o=>`<a class="rc k-${o.c}" href="${o.url}" target="_blank" rel="noopener"><span class="pl">${E(o.plat)}</span><h4>${E(o.name)}</h4><p>${E(P(o.d))}</p><span class="dm">${E(o.dom)} ↗</span></a>`).join('')+`<a class="rc gh" href="https://github.com/OkamiOps" target="_blank" rel="noopener"><span class="pl">GitHub</span><h4>github.com/<br>OkamiOps</h4><p>${E(OK.t('comu_p'))}</p><span class="dm">${OK.t('open')} ↗</span></a>`;
  $('#nums').innerHTML=OK.INSIGHTS.map(n=>`<a class="nm2 k-${n.c}" href="${OK.link(n.path)}" target="_blank" rel="noopener"><span class="lb">${E(n.cat)} · ${E(P(n.date))}</span><span class="big">${E(n.big)}<small>${E(n.unit)}</small></span><span class="lb">${E(P(n.lab))}</span><h3>${E(P(n.t))}</h3><span class="rd">${OK.t('read')} · ${n.min} min →</span></a>`).join('');
}
OK.onLang(render);
OK.init();
OKP.burger();
// lobo pousado sobre a linha do corte diagonal
function pin(){const em=$('.h-emb'),hb=$('.h-bot'),hero=$('.hero');const W=hero.clientWidth;const L=Math.min(Math.max(70,W*.09),140);
  const cx=W*(W<700?.78:.84);const y=hb.offsetTop+L*(1-cx/W);em.style.left=cx+'px';em.style.top=y+'px'}
pin();addEventListener('resize',pin);document.fonts&&document.fonts.ready.then(pin);
addEventListener('pointermove',e=>{const pv=$('#pv');if(pv.classList.contains('on')){pv.style.left=e.clientX+'px';pv.style.top=e.clientY+'px'}},{passive:true});
const rail=$('#rail');
$('#rp').addEventListener('click',()=>rail.scrollBy({left:-340,behavior:'smooth'}));
$('#rn').addEventListener('click',()=>rail.scrollBy({left:340,behavior:'smooth'}));
</script>
</body>
</html>
