<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkamiOps · Pilha</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="modes.css">
<style>
/* Layout: hero arrastável; depois capítulos empilhados (sticky) que deslizam um sobre o outro, alternando lobo (papel) e máquina (noite), com borda diagonal. */
.stack{position:relative}
.ch{position:sticky;top:68px;min-height:calc(100vh - 68px);min-height:calc(100svh - 68px);display:flex;flex-direction:column;justify-content:center;padding-block:clamp(88px,8vw,120px) clamp(48px,5vw,72px);clip-path:polygon(0 clamp(36px,5vw,72px),100% 0,100% 100%,0 100%);margin-top:calc(-1 * clamp(36px,5vw,72px))}
.ch:nth-child(even){clip-path:polygon(0 0,100% clamp(36px,5vw,72px),100% 100%,0 100%)}
.ch>.dim{position:absolute;inset:0;background:#000;opacity:var(--dim,0);pointer-events:none;z-index:2}
.ch>.wrap{position:relative;z-index:1;width:100%;transform:scale(var(--sc,1));transform-origin:50% 0}
.ch .cn{position:absolute;right:max(24px,env(safe-area-inset-right,0px));top:clamp(72px,7vw,104px);font:500 clamp(80px,12vw,200px)/.8 var(--disp);color:transparent;-webkit-text-stroke:1px var(--rule2);letter-spacing:-.05em;pointer-events:none;z-index:0}
.maq .cn{-webkit-text-stroke-color:#2a2a3d}
.ch .top{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr);gap:48px;align-items:end;margin-bottom:clamp(32px,4vw,56px)}
.ch .top h2{font-size:calc(clamp(44px,5.6vw,92px) * var(--ds));line-height:.94;margin-top:16px}

/* trilho lateral */
.rail{position:fixed;z-index:65;left:max(14px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);display:grid;gap:8px}
.rail a{width:14px;height:14px;border-radius:3px;border:1px solid #6a6a80;transition:transform .25s,background .25s}
.rail a.l{background:var(--paper)} .rail a.m{background:var(--night)}
.rail a.on{transform:scale(1.5);border-color:var(--o);box-shadow:0 0 0 3px rgba(255,122,61,.25)}
.rail a span{position:absolute;left:24px;white-space:nowrap;font:500 11px var(--mono);color:var(--fg);background:var(--night);padding:3px 8px;border-radius:6px;opacity:0;transform:translateX(-4px);transition:.2s;pointer-events:none}
.rail a:hover span{opacity:1;transform:none}

/* produtos */
.pgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.pg{display:flex;flex-direction:column;gap:12px;min-height:250px;padding:26px;border-radius:16px;border:1px solid var(--rule);background:var(--card);transition:transform .3s,border-color .3s}
.pg:hover{transform:translateY(-6px);border-color:var(--a)}
.pg .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.pg h3{font:400 clamp(40px,3.6vw,58px)/.92 var(--serif);color:var(--hd);letter-spacing:-.035em}
.pg .dm{font:500 12.5px var(--mono);color:var(--hd)}
.pg p{font-size:15px;flex:1}
.pg:hover h3{font-style:italic;color:var(--a)}

/* serviços */
.sgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.sv{display:flex;flex-direction:column;gap:12px;min-height:240px;padding:26px;border-radius:16px;border:1px solid var(--rule);background:var(--card);transition:transform .3s,border-color .3s}
.sv:hover{transform:translateY(-6px);border-color:var(--a)}
.sv .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--a)}
.sv h3{font:500 22px/1.15 var(--mono);color:var(--hd);letter-spacing:-.03em}
.sv p{font-size:15px;flex:1}
.sv .io{font:400 12.5px var(--mono);color:var(--hd);padding-top:12px;border-top:1px dashed var(--rule)}

/* webmcp */
.wgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.wgrid h2{font-size:calc(clamp(44px,5.6vw,92px) * var(--ds));line-height:.94;margin:16px 0 22px}

/* comunidade */
.cgrid{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:32px;align-items:start}
.tcard{display:grid;gap:14px;padding:30px;border-radius:18px;background:var(--paper);color:var(--ink-soft)}
.tcard .tg{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--c-ink)}
.tcard h3{font:400 clamp(48px,5vw,80px)/.9 var(--serif);color:var(--ink);letter-spacing:-.04em}
.tcard p{font-size:15px}
.tcard .qq{display:grid;gap:12px;padding:18px;border-radius:12px;background:var(--night)}
.olist{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 28px}
.olist a{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:15px 0;border-top:1px solid var(--line);transition:padding .25s}
.olist a:hover{padding-left:8px}
.olist b{font:500 16px var(--mono);color:var(--fg)}
.olist .pl{font:500 10.5px var(--mono);color:var(--a);border:1px solid var(--a);border-radius:4px;padding:1px 6px;align-self:center;white-space:nowrap}
.olist span.d{grid-column:1/-1;font-size:13px;color:var(--fg-mute);display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}

/* insights */
.igrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(24px,3vw,44px)}
.ig{display:flex;flex-direction:column;gap:12px;padding-top:20px;border-top:2px solid var(--ink)}
.ig .big{font:400 clamp(60px,7vw,124px)/.85 var(--serif);color:var(--a);letter-spacing:-.05em}
.ig .big small{font-size:.32em;color:var(--mute);letter-spacing:0}
.ig .lb{font:500 11.5px var(--mono);color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.ig h3{font:500 19px/1.3 var(--sans);color:var(--hd)}
.ig .go{font:500 12.5px var(--mono);color:var(--hd)}

/* empresa */
.egrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:start}
.egrid h2{font-size:calc(clamp(48px,6.4vw,108px) * var(--ds));line-height:.92;margin:16px 0 22px}
.rules{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 24px;counter-reset:r}
.rules div{padding:16px 0;border-top:1px solid var(--line);display:grid;gap:4px;counter-increment:r}
.rules b{font:500 14px var(--mono);color:var(--fg)}
.rules b::before{content:counter(r,decimal-leading-zero) "  ";color:var(--o)}
.rules span{font-size:13.5px;color:var(--fg-mute)}
.est{display:flex;gap:32px;flex-wrap:wrap;margin-top:8px}
.est div{display:grid;font:400 12px var(--mono);color:var(--fg-mute)}
.est b{font:500 44px/1 var(--mono);color:var(--fg);letter-spacing:-.05em}

/* contato */
.ctg2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:56px;align-items:center}
.ctg2 h2{font:400 clamp(60px,9vw,160px)/.86 var(--serif);color:var(--ink);letter-spacing:-.055em;margin:16px 0 22px}
.ctg2 h2 em{font-style:italic;color:var(--o-ink)}
.ctg2 .copyrow{color:var(--ink);margin-top:10px} .ctg2 .copyrow small{color:var(--ink-soft)}
.ctg2 form{display:grid;gap:14px;padding:28px;border-radius:18px;background:var(--night)}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ctg2 form .btn{justify-self:start;border-radius:8px}

@media (max-width:1100px){
  .pgrid,.sgrid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pg,.sv{min-height:0}
}
@media (max-width:900px){
  .ch{position:relative;top:auto;min-height:0}
  .ch>.wrap{transform:none}
  .rail{display:none}
  .ch .top,.wgrid,.cgrid,.egrid,.ctg2{grid-template-columns:1fr}
  .igrid{grid-template-columns:1fr}
  .ch .cn{font-size:80px}
}
@media (max-width:640px){.pgrid,.sgrid,.olist,.rules,.f2{grid-template-columns:1fr}.tcard,.ctg2 form{padding:22px}}
</style>
</head>
<body>
<div id="hdr"></div>
<nav class="rail" id="rail" aria-label="Capítulos"></nav>
<main id="top">
  <div id="hero"></div>
  <div class="stack" id="stack">
    <section class="ch lobo k-o" id="produtos" data-r="l"><div class="dim"></div><span class="cn">01</span><div class="wrap">
      <div class="top"><div><span class="kick" data-i="prod_k"></span><h2 class="H" data-i="prod_h"></h2></div><p class="lede" data-i="prod_p"></p></div>
      <div class="pgrid" id="pgrid"></div>
    </div></section>

    <section class="ch maq k-c" id="servicos" data-r="m"><div class="dim"></div><span class="cn">02</span><div class="wrap">
      <div class="top"><div><span class="kick" data-i="serv_k"></span><h2 class="H" data-i="serv_h"></h2></div><div style="display:grid;gap:20px;justify-items:start"><p class="lede" data-i="serv_p"></p><a class="btn btn-p" data-href="/servicos/" target="_blank" rel="noopener" data-i="plans"></a></div></div>
      <div class="sgrid" id="sgrid"></div>
    </div></section>

    <section class="ch lobo k-c" id="webmcp" data-r="l"><div class="dim"></div><span class="cn">03</span><div class="wrap wgrid">
      <div><span class="kick" data-i="web_k"></span><h2 class="H" data-i="web_h"></h2><p class="lede" data-i="web_p"></p><a class="btn btn-p" style="margin-top:24px" data-href="/agents/" target="_blank" rel="noopener" data-i="web_cta"></a></div>
      <div id="webt"></div>
    </div></section>

    <section class="ch maq k-m" id="comunidade" data-r="m"><div class="dim"></div><span class="cn">04</span><div class="wrap">
      <div class="top"><div><span class="kick" data-i="comu_k"></span><h2 class="H" data-i="comu_h"></h2></div><p class="lede" data-i="comu_p"></p></div>
      <div class="cgrid"><div class="tcard" id="tcard"></div><div class="olist" id="olist"></div></div>
    </div></section>

    <section class="ch lobo k-o" id="insights" data-r="l"><div class="dim"></div><span class="cn">05</span><div class="wrap">
      <div class="top"><div><span class="kick" data-i="ins_k"></span><h2 class="H" data-i="ins_h"></h2></div><div style="display:grid;gap:20px;justify-items:start"><p class="lede" data-i="ins_p"></p><a class="btn btn-g" data-href="/insights/" target="_blank" rel="noopener" data-i="all_ins"></a></div></div>
      <div class="igrid" id="igrid"></div>
    </div></section>

    <section class="ch maq k-o" id="empresa" data-r="m"><div class="dim"></div><span class="cn">06</span><div class="wrap egrid">
      <div><span class="kick" data-i="emp_k"></span><h2 class="H" data-i="emp_h"></h2><p class="lede" data-i="emp_p"></p>
        <div class="est" style="margin-top:28px"><div><b>20+</b><span data-i="yrs_tech"></span></div><div><b>10+</b><span data-i="yrs_sec"></span></div><div><b>BR·DE</b><span data-i="stat_ops"></span></div></div>
        <a class="btn btn-g" style="margin-top:28px" data-href="/empresa/" target="_blank" rel="noopener" data-i="emp_more"></a></div>
      <div class="rules" id="rules"></div>
    </div></section>

    <section class="ch lobo k-o" id="contato" data-r="l"><div class="dim"></div><span class="cn">07</span><div class="wrap ctg2">
      <div><span class="kick" data-i="ct_k"></span><h2 data-i="ct_h"></h2><p class="lede" data-i="ct_p"></p>
        <div class="copyrow" style="margin-top:24px"><small data-i="sales"></small><span>contato@okamiops.com</span><button type="button" data-copy="contato@okamiops.com" data-i="copy"></button></div>
        <div class="copyrow"><small>disclosure</small><span>security@okamiops.com</span><button type="button" data-copy="security@okamiops.com" data-i="copy"></button></div></div>
      <form data-demo>
        <div class="f2"><div class="field"><label for="f1" data-i="f_name"></label><input id="f1" autocomplete="name" required></div><div class="field"><label for="f2" data-i="f_email"></label><input id="f2" type="email" autocomplete="email" required></div></div>
        <div class="field"><label for="f3" data-i="f_company"></label><input id="f3" autocomplete="organization"></div>
        <div class="field"><label for="f4" data-i="f_msg"></label><textarea id="f4" rows="4" required></textarea></div>
        <button class="btn btn-o" type="submit" data-i="f_send"></button><p class="note" data-note hidden></p>
      </form>
    </div></section>
  </div>
</main>
<div id="ft"></div>

<script src="okami.js"></script>
<script src="parts.js"></script>
<script src="extra.js"></script>
<script>
const $=s=>document.querySelector(s),E=OK.esc,P=OK.pick;
$('#hdr').outerHTML=OKP.header();
$('#hero').outerHTML=OKP.hero();
$('#ft').outerHTML=OKP.footer();
const CH=[...document.querySelectorAll('.ch')];
const NAMES={produtos:'nav_prod',servicos:'nav_serv',webmcp:'web_k',comunidade:'nav_comu',insights:'nav_ins',empresa:'nav_emp',contato:'ct_k'};
function render(){
  OKP.heroText();
  $('#pgrid').innerHTML=OK.PRODUCTS.map(p=>`<a class="pg k-${p.c}" href="${p.url}" target="_blank" rel="noopener"><span class="tg">${E(P(p.kind))}</span><h3>${E(p.name)}</h3><span class="dm">${E(p.dom)}</span><p>${E(P(p.d))}</p></a>`).join('');
  $('#sgrid').innerHTML=OK.SERVICES.map(s=>`<a class="sv k-${s.c}" href="${OK.link(s.path)}" target="_blank" rel="noopener"><span class="tg">${s.tag}</span><h3>${E(P(s.name))}</h3><p>${E(P(s.d))}</p><span class="io">$ ${E(P(s.fmt))}</span></a>`).join('');
  $('#webt').innerHTML=OKP.webTable();
  const t=OK.OSS.find(o=>o.store);
  $('#tcard').innerHTML=`<span class="tg">★ ${E(t.plat)}</span><h3>${E(t.name)}</h3><p>${E(P(t.d))}</p><div class="qq" aria-hidden="true">${OKP.quotas()}</div><div>${OKP.store(t)}</div>`;
  $('#olist').innerHTML=OK.OSS.filter(o=>!o.store).map(o=>`<a class="k-${o.c}" href="${o.url}" target="_blank" rel="noopener"><b>${E(o.name)}</b><span class="pl">${E(o.plat)}</span><span class="d">${E(P(o.d))}</span></a>`).join('')+`<a class="k-m" href="https://github.com/OkamiOps" target="_blank" rel="noopener"><b>github.com/OkamiOps</b><span class="pl">GitHub</span><span class="d">${OK.t('open')} ↗</span></a>`;
  $('#igrid').innerHTML=OK.INSIGHTS.map(n=>`<a class="ig k-${n.c}" href="${OK.link(n.path)}" target="_blank" rel="noopener"><span class="lb">${E(n.cat)} · ${E(P(n.date))}</span><span class="big">${E(n.big)}<small>${E(n.unit)}</small></span><span class="lb">${E(P(n.lab))}</span><h3>${E(P(n.t))}</h3><span class="go">${OK.t('read')} · ${n.min} min →</span></a>`).join('');
  $('#rules').innerHTML=OKP.rules();
  $('#rail').innerHTML=CH.map(c=>`<a href="#${c.id}" class="${c.dataset.r}" aria-label="${OK.t(NAMES[c.id]).replace(/<[^>]+>/g,'')}"><span>${OK.t(NAMES[c.id])}</span></a>`).join('');
  fit();
}
// capítulo mais alto que a tela gruda pelo rodapé, para nada ficar escondido
function fit(){const vh=innerHeight;CH.forEach(c=>{c.style.top=Math.min(68,vh-c.offsetHeight)+'px'})}
function onScroll(){
  if(innerWidth<=900)return;
  const vh=innerHeight;let cur=0;
  CH.forEach((c,i)=>{
    const nx=CH[i+1];let p=0;
    if(nx){const t=nx.getBoundingClientRect().top;p=Math.min(1,Math.max(0,1-(t-68)/(vh-68)))}
    c.style.setProperty('--dim',(p*.55).toFixed(3));
    c.querySelector('.wrap').style.setProperty('--sc',(1-p*.05).toFixed(4));
    if(c.getBoundingClientRect().top<vh*.5)cur=i;
  });
  document.querySelectorAll('#rail a').forEach((a,i)=>a.classList.toggle('on',i===cur));
  $('#rail').style.opacity=CH[0].getBoundingClientRect().top<vh*.6?1:0;
}
OK.onLang(render);
OK.init();
OKP.heroWire();
OKP.burger();
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{fit();onScroll()});
onScroll();
document.fonts&&document.fonts.ready.then(()=>{fit();onScroll()});
</script>
</body>
</html>
