<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OkamiOps</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500;600;800&family=Space+Grotesk:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="base.css">
<link rel="stylesheet" href="modes.css">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="home">
<div id="hdr"></div>
<nav class="rail" id="rail" aria-label="Capítulos"></nav>
<main id="top">
  <div id="hero"></div>
  <div id="stack">
    <section class="ch lobo k-o" id="produtos" data-r="l"><div class="dim"></div><div class="wrap">
      <div class="top"><div><span class="kick">01 · <span data-i="prod_k"></span></span><h2 class="H" data-i="prod_h"></h2></div><p class="lede" data-i="prod_p"></p></div>
      <div class="vit"><div><div class="plist" id="plist" role="tablist" aria-label="Produtos"></div><a class="btn btn-ink go" id="pgo" href="#" target="_blank" rel="noopener"></a></div>
        <div class="stage"><div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url" id="purl"></span></div><div class="shot" id="pshot"></div></div><span class="badge" id="pbadge"></span></div></div>
      <div class="pcar"><div class="pc-track" id="pctrack" aria-label="Produtos"></div><div class="pc-nav"><span class="pc-n" id="pcn">1 / 4</span><span class="pc-dots" id="pcdots"></span></div></div>
    </div></section>

    <section class="ch maq k-c" id="servicos" data-r="m"><div class="dim"></div><div class="wrap">
      <div class="top"><div><span class="kick">02 · <span data-i="serv_k"></span></span><h2 class="H" data-i="serv_h"></h2></div><div style="display:grid;gap:20px;justify-items:start"><p class="lede" data-i="serv_p"></p><a class="btn btn-p" data-href="/servicos/" target="_blank" rel="noopener" data-i="plans"></a></div></div>
      <div class="sgrid" id="sgrid"></div>
      <div class="web"><div><span class="kicker" data-i="web_k"></span><h3 data-i="web_h"></h3><p style="font-size:15px" data-i="web_p"></p></div><div id="webt"></div></div>
    </div></section>

    <section class="ch lobo k-m" id="comunidade" data-r="l"><div class="dim"></div><div class="wrap">
      <div class="top"><div><span class="kick">03 · <span data-i="comu_k"></span></span><h2 class="H" data-i="comu_h"></h2></div><div style="display:grid;gap:20px;justify-items:start"><p class="lede" data-i="comu_p"></p><a class="btn btn-ink" href="https://github.com/OkamiOps" target="_blank" rel="noopener">github.com/OkamiOps ↗</a></div></div>
      <div class="ogrid" id="ogrid"></div>
    </div></section>

    <section class="ch maq k-o" id="insights" data-r="m"><div class="dim"></div><div class="wrap">
      <div class="top"><div><span class="kick">04 · <span data-i="ins_k"></span></span><h2 class="H" data-i="ins_h"></h2></div><div style="display:grid;gap:20px;justify-items:start"><p class="lede" data-i="ins_p"></p><a class="btn btn-g" data-href="/insights/" target="_blank" rel="noopener" data-i="all_ins"></a></div></div>
      <div class="ivit"><div class="ilist" id="ilist" role="tablist" aria-label="Insights"></div><div class="ipanel" id="ipanel" role="tabpanel" aria-live="polite"></div></div>
    </div></section>

    <section class="ch lobo k-o" id="empresa" data-r="l"><div class="dim"></div><div class="wrap egrid">
      <div><span class="kick">05 · <span data-i="emp_k"></span></span><h2 data-i="emp_h"></h2><p class="lede" data-i="emp_p"></p>
        <div class="est"><div><b>20+</b><span data-i="yrs_tech"></span></div><div><b>10+</b><span data-i="yrs_sec"></span></div><div><b>BR·DE</b><span data-i="stat_ops"></span></div></div>
        <a class="btn btn-line-p" style="margin-top:28px" data-href="/empresa/" target="_blank" rel="noopener" data-i="emp_more"></a></div>
      <div class="rules" id="rules"></div>
    </div></section>

    <section class="ch maq k-o ctx" id="contato" data-r="m"><div class="dim"></div><div class="wrap">
      <span class="kick">06 · <span data-i="ct_k"></span></span>
      <h2 class="ctx-h" data-i="ct_h"></h2>
      <div class="ctx-g">
        <div class="ctx-card">
          <form id="ctform" novalidate>
            <div class="f2"><div class="fl"><label for="f1" data-i="f_name"></label><input id="f1" autocomplete="name" required></div><div class="fl"><label for="f2" data-i="f_email"></label><input id="f2" type="email" autocomplete="email" required></div></div>
            <div class="fl"><label for="f3"><span data-i="f_company"></span> <small data-i="optional"></small></label><input id="f3" autocomplete="organization"></div>
            <div class="fl"><label for="f4" data-i="f_msg"></label><textarea id="f4" rows="3" required></textarea></div>
            <div class="sendrow"><button class="btn btn-ink" type="submit"><span data-i="f_send"></span> →</button><span data-i="reply"></span></div>
          </form>
          <div class="done" id="ctdone" hidden><span class="ck" aria-hidden="true">✓</span><h3 data-i="ok_t"></h3><p data-i="ok_b"></p><button type="button" class="btn btn-line-p" data-i="again"></button></div>
        </div>
        <div class="ctx-side">
          <span class="lb" data-i="direct"></span>
          <div class="mt"><div class="mt-t"><small data-i="sales"></small><b>contato@okamiops.com</b><span data-i="ct_p"></span></div><button type="button" data-copy="contato@okamiops.com" data-i="copy"></button></div>
          <div class="mt"><div class="mt-t"><small>disclosure</small><b>security@okamiops.com</b><span data-i="secq"></span></div><button type="button" data-copy="security@okamiops.com" data-i="copy"></button></div>
          <div class="tz2"><div><small data-i="sp"></small><b id="clk-sp">--:--</b></div><div><small data-i="ber"></small><b id="clk-ber">--:--</b></div></div>
          <p class="rm" data-i="remote"></p>
        </div>
      </div>
    </div></section>
  </div>
</main>
<div id="ft"></div>

<script src="okami.js"></script>
<script src="routes.js"></script>
<script src="parts.js"></script>
<script src="extra.js"></script>
<script src="insights.js"></script>
<script src="heroes.js"></script>
<script src="contact.js"></script>
<script src="nav.js"></script>
<script>
const $=s=>document.querySelector(s),E=OK.esc,P=OK.pick;
$('#hdr').outerHTML=NAV.html;
$('#hero').outerHTML=HEROES.c;
$('#ft').outerHTML=OKP.footer();
OKP.sig();
const CH=[...document.querySelectorAll('.ch')];
CH.slice(0,-1).forEach(c=>c.insertAdjacentHTML('afterend','<div class="hold" aria-hidden="true"></div>'));
const NAMES={produtos:'nav_prod',servicos:'nav_serv',comunidade:'nav_comu',insights:'nav_ins',empresa:'nav_emp',contato:'ct_k'};
const mobile=()=>matchMedia('(max-width:640px)').matches;
let sel=0,isel=0;
function ishow(){
  const n=OK.INSIGHTS[isel],d=INSD[isel];
  document.querySelectorAll('#ilist button').forEach((b,i)=>b.setAttribute('aria-selected',i===isel));
  let chart='';
  if(d.chart==='bars'){const mx=Math.max(...d.rows.map(r=>r[1])),mn=Math.min(...d.rows.map(r=>r[1]));chart=`<div class="bars">${d.rows.map(r=>`<div class="br ${r[1]===mx||r[1]===mn?'ext':''}"><span class="n">${E(r[0])}</span><span class="t"><i style="--w:${(r[1]/mx*100).toFixed(1)}%"></i></span><span class="v">${d.fmt(r[1])}</span></div>`).join('')}</div>`}
  else{chart=`<div class="risks">${d.rows.map(r=>`<div class="rk ${r[2]?'hi':''}"><b>${r[0]}</b><span>${E(r[1])}</span><i>${E(P(r[2]?d.hi:d.mid))}</i></div>`).join('')}</div>`}
  $('#ipanel').className='ipanel k-'+n.c;
  $('#ipanel').innerHTML=`<div class="hd2"><b>${E(P(d.title))}</b><span>${d.unit?E(d.unit):''}</span></div><p class="callout">${E(P(d.callout))}</p>${chart}<ol class="tk">${d.tk.map(t=>`<li><span>${P(t)}</span></li>`).join('')}</ol><div class="ft"><span>${OK.t(d.chart==='risks'?'src3':'src')}</span><a class="btn btn-o" href="${OK.link(n.path)}" target="_blank" rel="noopener">${OK.t('read')} · ${n.min} min →</a></div>`;
}
function show(){
  const p=OK.PRODUCTS[sel];
  document.querySelectorAll('#plist button').forEach((b,i)=>b.setAttribute('aria-selected',i===sel));
  $('#purl').textContent=p.dom;
  $('#pshot').innerHTML=OK.PRODUCTS.map((q,i)=>`<img src="img/${q.img}-d.jpg" alt="${E(q.name)}, página inicial" style="opacity:${i===sel?1:0}" ${i?'loading="lazy"':''}>`).join('');
  $('#pgo').textContent=`${OK.t('visit')} ${p.dom} ↗`;$('#pgo').href=p.url;
  $('#pbadge').innerHTML=`<span class="dot"></span> ${OK.t('online')} · ${E(P(p.model))}`;
}
function render(){
  OKP.heroText();
  $('#plist').innerHTML=OK.PRODUCTS.map((p,i)=>`<button type="button" role="tab" class="k-${p.c}" aria-selected="${i===sel}"><span class="nm">${E(p.name)}</span><span class="tg">${E(P(p.kind))}</span><span class="d">${E(P(p.d))}</span></button>`).join('');
  document.querySelectorAll('#plist button').forEach((b,i)=>{const go=()=>{if(sel!==i){sel=i;show()}};b.addEventListener('mouseenter',go);b.addEventListener('focus',go);b.addEventListener('click',go)});
  show();
  $('#pctrack').innerHTML=OK.PRODUCTS.map(p=>`<article class="pcc k-${p.c}"><div class="ph"><div class="phone"><img src="img/${p.img}-m.jpg" alt="${E(p.name)} no celular" loading="lazy"></div></div><div class="bd"><div class="tp"><h3>${E(p.name)}</h3><span class="tg">${E(P(p.kind))}</span></div><p>${E(P(p.d))}</p><span class="st"><span class="dot"></span> ${OK.t('online')} · ${E(P(p.model))}</span><a class="btn btn-ink" href="${p.url}" target="_blank" rel="noopener">${OK.t('visit')} ${E(p.dom)} ↗</a></div></article>`).join('');
  $('#pcdots').innerHTML=OK.PRODUCTS.map((_,i)=>`<i class="${i?'':'on'}"></i>`).join('');
  $('#sgrid').innerHTML=OK.SERVICES.map(s=>`<a class="sv k-${s.c}" href="${OK.link(s.path)}" target="_blank" rel="noopener"><span class="tg">${s.tag}</span><h3>${E(P(s.name))}</h3><p>${E(P(s.d))}</p><span class="io">$ ${E(P(s.fmt))}</span></a>`).join('');
  $('#webt').innerHTML=OKP.webTable();
  const t=OK.OSS.find(o=>o.store);
  const card=o=>`<a class="oc k-${o.c}" href="${o.name==='Okami Agent'?'comunidade-okami-agent.html':o.url}" ${o.name==='Okami Agent'?'':'target="_blank" rel="noopener"'}><div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">${E(o.dom)}</span></div><div class="shot"><img src="img/${o.img}-d.jpg" alt="${E(o.name)}, página inicial" loading="lazy"></div></div><div class="row"><h3>${E(o.name)}</h3><span class="pl">${E(o.plat)}</span></div><p>${E(P(o.d))}</p></a>`;
  const by=n=>OK.OSS.find(o=>o.name===n);
  const sn=by('Okami Sentinel'),ok=by('OkTally');
  $('#ogrid').innerHTML=`<div class="tally"><div class="phone"><img src="img/tally-m.jpg" alt="Okami Tally no iPhone" loading="lazy"></div><div><span class="tg">★ ${E(t.plat)}</span><h3>${E(t.name)}</h3><p>${E(P(t.d))}</p>${OKP.store(t)}</div></div>`+
    ['Okami Agent','Okami Monitor','OkamiCode','Okami Maturity'].map(n=>card(by(n))).join('')+
    `<a class="oc txt k-${ok.c}" href="${ok.url}" target="_blank" rel="noopener"><div><div class="row" style="margin-top:0"><h3>${E(ok.name)}</h3><span class="pl">${E(ok.plat)}</span></div><p style="margin-top:12px">${E(P(ok.d))}</p></div><span class="go">github.com/OkamiOps ↗</span></a>`+
    card(by('OkamiUNI'))+
    `<a class="sent" href="${sn.url}" target="_blank" rel="noopener"><div><span class="tg">★ ${E(sn.plat)} · AppSec</span><h3>${E(sn.name)}</h3><p>${E(P(sn.d))}</p><span class="btn btn-o">${OK.t('open')} ${E(sn.dom)} ↗</span></div><div class="browser"><div class="bar"><i></i><i></i><i></i><span class="url">${E(sn.dom)}</span></div><div class="shot"><img src="img/sentinel-d.jpg" alt="Okami Sentinel, página inicial" loading="lazy"></div></div></a>`+
    `<a class="ghw" href="https://github.com/OkamiOps" target="_blank" rel="noopener"><b>github.com/OkamiOps</b><span>7 open-source · 1 iOS · ${OK.t('open')} ↗</span></a>`;
  $('#ilist').innerHTML=OK.INSIGHTS.map((n,i)=>`<button type="button" role="tab" class="k-${n.c}" aria-selected="${i===isel}"><span class="lb">${E(n.cat)} · ${E(P(n.date))} · ${n.min} min</span><span class="big">${E(n.big)}<small>${E(n.unit)}</small></span><span class="t">${E(P(n.t))}</span></button>`).join('');
  document.querySelectorAll('#ilist button').forEach((b,i)=>{const go=()=>{if(isel!==i){isel=i;ishow()}};b.addEventListener('mouseenter',go);b.addEventListener('focus',go);b.addEventListener('click',go)});
  ishow();
  $('#rules').innerHTML=OKP.rules();
  $('#rail').innerHTML=CH.map(c=>{const n=OK.t(NAMES[c.id]).replace(/<[^>]+>/g,'');return `<a href="#${c.id}" class="${c.dataset.r}" aria-label="${n}"><span>${n}</span></a>`}).join('');
  fit();
}
const NH=()=>parseFloat(getComputedStyle(document.body).getPropertyValue('--navh'))||0;
function fit(){const vh=innerHeight,nh=NH();CH.forEach(c=>{c.style.top=innerWidth>900?Math.min(nh,vh-c.offsetHeight)+'px':''})}
function onScroll(){
  const vh=innerHeight;let cur=0;
  CH.forEach((c,i)=>{
    const nx=CH[i+1];let p=0;
    if(nx&&innerWidth>900){const t=nx.getBoundingClientRect().top;const nh=NH();p=Math.min(1,Math.max(0,1-(t-nh)/(vh-nh)))}
    c.style.setProperty('--dim',(p*.5).toFixed(3));
    c.querySelector(':scope>.wrap').style.setProperty('--sc',(1-p*.04).toFixed(4));
    if(c.getBoundingClientRect().top<vh*.5)cur=i;
  });
  document.querySelectorAll('#rail a').forEach((a,i)=>a.classList.toggle('on',i===cur));
  const ftop=document.querySelector('.foot')?.getBoundingClientRect().top??1e9;
  $('#rail').style.opacity=(CH[0].getBoundingClientRect().top<vh*.6&&ftop>vh*.7)?1:0;
  $('#rail').style.pointerEvents=$('#rail').style.opacity==='1'?'':'none';
}
OK.onLang(render);
OK.onLang(()=>CONTACT.render());
const pct=document.getElementById('pctrack');
pct.addEventListener('scroll',()=>{const c=pct.children[0];if(!c)return;const w=c.getBoundingClientRect().width+14;const i=Math.min(pct.children.length-1,Math.round(pct.scrollLeft/w));document.getElementById('pcn').textContent=`${i+1} / ${pct.children.length}`;document.querySelectorAll('#pcdots i').forEach((d,j)=>d.classList.toggle('on',j===i))},{passive:true});
OK.init();
CONTACT.init();
NAV.init();

OKP.burger();
addEventListener('scroll',onScroll,{passive:true});
addEventListener('resize',()=>{fit();onScroll()});
onScroll();
document.fonts&&document.fonts.ready.then(()=>{fit();onScroll()});
addEventListener('load',()=>{fit();onScroll()});
</script>
</body>
</html>
